# Phase D — NeoForge/vanilla easy events + hold/env

- key: D1
  title: "Catch a Fish"
  category: vanilla_event
  status: active
  trigger: "ItemFishedEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Улов! Рыба удивлена не меньше вашего. Жарим или отпускаем с нравоучением?"
      frames_en:
        - "A catch! The fish is as surprised as you are. Fry it, or let it go with a lecture?"
    - weight: 50
      frames:
        - "Крючок сработал. Деревня аплодирует тихо."
        - "Громко — только если угостите."
      frames_en:
        - "The hook worked. The village applauds quietly."
        - "Loudly — only if you share."
    - weight: 50
      frames:
        - "Рыбалка у нас — спорт и сплетни сразу."
        - "Расскажите, какого размера была ложь."
      frames_en:
        - "Fishing here is sport and gossip at once."
        - "Tell us how big the lie was."

- key: D2
  title: "Tame an Animal"
  category: vanilla_event
  status: active
  trigger: "AnimalTameEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Приручили зверя — теперь у нас общий питомец площади!"
        - "Только не пускайте его в погреб."
      frames_en:
        - "You tamed a beast — now we share a town-square pet!"
        - "Just keep it out of the cellar."
    - weight: 50
      frames:
        - "Сердечки в глазах и кости в кармане. Классика."
        - "Мы тоже хотим дружить… за морковь."
      frames_en:
        - "Hearts in the eyes and bones in the pocket. Classic."
        - "We want friendship too… for carrots."
    - weight: 50
      frames:
        - "Новый друг деревни. Старые друзья уже ревнуют."
        - "Куры особенно."
      frames_en:
        - "A new village friend. Old friends are already jealous."
        - "Especially the chickens."

- key: D3
  title: "Use a Totem of Undying"
  category: vanilla_event
  status: active
  trigger: "LivingUseTotemEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Тотем сверкнул — смерть получила отказ по форме!"
        - "Мы чуть не оплакали вас заранее."
      frames_en:
        - "The totem flashed — death got a formal rejection!"
        - "We almost mourned you early."
    - weight: 50
      frames:
        - "Бессмертие на секунду. Сплетни — на неделю."
        - "Расскажете у колокола?"
      frames_en:
        - "Immortality for a second. Gossip for a week."
        - "Tell it by the bell?"
    - weight: 50
      frames:
        - "Вы упали и встали красивее, чем встаёт мэр."
        - "Завидуем культурно."
      frames_en:
        - "You fell and stood up prettier than the mayor rises."
        - "We envy culturally."

- key: D4
  title: "Block with a Shield"
  category: vanilla_event
  status: active
  trigger: "LivingShieldBlockEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Щит принял удар — геройство со скрипом дерева."
        - "Держите крепче, соседи болеют!"
      frames_en:
        - "Shield took the hit — heroics with a wooden creak."
        - "Hold tighter, neighbors are cheering!"
    - weight: 50
      frames:
        - "Блок щитом. Мы спрятались за щитом морально."
        - "Спасибо за представление."
      frames_en:
        - "Blocked with a shield. We hid behind it morally."
        - "Thanks for the show."
    - weight: 50
      frames:
        - "Удар отскочил. Гордость — нет."
        - "Зато урок для молодёжи."
      frames_en:
        - "The hit bounced. Pride did not."
        - "But a lesson for the youth."

- key: D5
  title: "Draw a Bow"
  category: vanilla_event
  status: active
  trigger: "ArrowNockEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Тетиву натянули — воробьи уже в отпуске."
        - "Целитесь мимо окон, пожалуйста."
      frames_en:
        - "Bow drawn — sparrows already on vacation."
        - "Aim past the windows, please."
    - weight: 50
      frames:
        - "Лук смотрит серьёзно. Мы смотрим осторожно."
        - "Стрела — не сплетня, её не вернёшь."
      frames_en:
        - "The bow looks serious. We look careful."
        - "An arrow is not gossip; you cannot take it back."
    - weight: 50
      frames:
        - "Натянуто, как нервы деревенского совета. Отпускайте мягче, чем политики."
      frames_en:
        - "Tight as the village council's nerves. Let go gentler than politics does."

- key: D6
  title: "Use Bone Meal"
  category: vanilla_event
  status: active
  trigger: "BonemealEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Костная мука — ускоритель сплетен и ростков. Грядка благодарит. Соседи подозревают магию."
      frames_en:
        - "Bone meal — accelerator for gossip and sprouts. The bed thanks you. Neighbors suspect magic."
    - weight: 50
      frames:
        - "Посыпали — и жизнь позеленела быстрее отчёта мэра."
        - "Можно и нам немного оптимизма?"
      frames_en:
        - "You sprinkled — and life greened faster than the mayor's report."
        - "May we have a little optimism too?"
    - weight: 50
      frames:
        - "Удобрение с характером. Растения уже важничают."
        - "Мы тоже, чуть-чуть."
      frames_en:
        - "Fertilizer with attitude. Plants already strut."
        - "So do we, a little."

- key: D7
  title: "Repair on an Anvil"
  category: vanilla_event
  status: active
  trigger: "AnvilRepairEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Наковальня звенит — уровни плачут. Зато меч снова вежливый."
      frames_en:
        - "The anvil clangs — your levels weep. But the sword is polite again."
    - weight: 50
      frames:
        - "Починка со стилем и со звуком соседа в шесть утра."
        - "Мы не жалуемся. Почти."
      frames_en:
        - "A stylish repair with a 6 a.m. neighbor soundtrack."
        - "We are not complaining. Almost."
    - weight: 50
      frames:
        - "Сломали — починили — рассказали. Цикл героя."
        - "Оставьте нам стружку на память."
      frames_en:
        - "Broke — fixed — told the tale. Hero cycle."
        - "Leave us a scrap for memory."

- key: D8
  title: "Enchant an Item"
  category: vanilla_event
  status: active
  trigger: "PlayerEnchantItemEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Чары легли на вещь — даже воздух стал умнее."
        - "Переведите руны на крестьянский!"
      frames_en:
        - "Enchantments settled — even the air got smarter."
        - "Translate the runes to peasant!"
    - weight: 50
      frames:
        - "Стол зачарования шепчет. Мы делаем вид, что поняли."
        - "Красиво блестит — этого хватит."
      frames_en:
        - "The enchanting table whispers. We pretend we understood."
        - "Pretty shine is enough."
    - weight: 50
      frames:
        - "Магия в предмете, скепсис в нас."
        - "Проверьте, не кусается ли."
      frames_en:
        - "Magic in the item, skepticism in us."
        - "Check it does not bite."

- key: D9
  title: "Pick Up XP"
  category: vanilla_event
  status: active
  trigger: "PlayerXpEvent.PickupXp"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Опыт подбираете — мудрость звенит в кармане!"
        - "Делитесь советом, не только уровнями."
      frames_en:
        - "Picking up XP — wisdom jingles in the pocket!"
        - "Share advice, not only levels."
    - weight: 50
      frames:
        - "Зелёные орбы — валюта героев и зависти."
        - "Мы завидуем тихо."
      frames_en:
        - "Green orbs — currency of heroes and envy."
        - "We envy quietly."
    - weight: 50
      frames:
        - "Подняли опыт. Опустили скромность."
        - "Нормально. Мы тоже так умеем… мысленно."
      frames_en:
        - "Picked up experience. Dropped modesty."
        - "Fine. We can do that… mentally."

- key: D10
  title: "Change Dimension"
  category: vanilla_event
  status: active
  trigger: "PlayerChangedDimensionEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Смена измерения — шляпы придержать, желудки тоже!"
        - "Пришлите открытку из Незера без лавы."
      frames_en:
        - "Dimension change — hold hats and stomachs!"
        - "Send a Nether postcard without lava."
    - weight: 50
      frames:
        - "Вас не стало здесь, зато стало где-то опаснее."
        - "Вернитесь с историями, не с криперами."
      frames_en:
        - "You vanished here and appeared somewhere worse."
        - "Return with stories, not creepers."
    - weight: 50
      frames:
        - "Портал забрал гостя. Площадь недосчиталась сплетен."
        - "Мы подождём… недолго."
      frames_en:
        - "The portal took a guest. The square is short on gossip."
        - "We will wait… briefly."

- key: D11
  title: "Respawn After Death"
  category: vanilla_event
  status: active
  trigger: "PlayerRespawnEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Снова с нами! Смерть вас недолюбила."
        - "Расскажете, что видели, пока мы паниковали?"
      frames_en:
        - "Back with us! Death did not love you enough."
        - "Tell what you saw while we panicked?"
    - weight: 50
      frames:
        - "Респаун — лучший фокус площади."
        - "Только лут в следующий раз прихватите обратно."
      frames_en:
        - "Respawn — the square's best magic trick."
        - "Next time fetch the loot back too."
    - weight: 50
      frames:
        - "Вы вернулись. Куры выдохнули. Мы тоже. В колокол можно не бить."
      frames_en:
        - "You're back. The chickens exhaled. So did we. No need to ring the alarm."

- key: D12
  title: "Take Smelted Items"
  category: vanilla_event
  status: active
  trigger: "ItemSmeltedEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Из печи достали горячее сокровище! Пахнет прогрессом и лёгким подгаром."
      frames_en:
        - "A hot treasure out of the furnace! Smells like progress and a little scorch."
    - weight: 50
      frames:
        - "Горячий крафт. Холодные пальцы — ваши проблемы."
        - "Мы подадим моральную прихватку."
      frames_en:
        - "Hot craft. Cold fingers — your problem."
        - "We offer a moral oven mitt."
    - weight: 50
      frames:
        - "Плавка готова. Зависть только начинается. Поделитесь слитком, будьте человеком."
      frames_en:
        - "Smelting done. Envy just starting. Share an ingot, be human."

- key: D13
  title: "Craft an Item Nearby"
  category: vanilla_event
  status: active
  trigger: "ItemCraftedEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Верстак щёлкнул — родилась новая штуковина!"
        - "Покажите, мы сделаем умное лицо."
      frames_en:
        - "The crafting table clicked — a new thingie was born!"
        - "Show us, we will make a smart face."
    - weight: 50
      frames:
        - "Крафт на глазах у деревни — театр инженерии."
        - "Бис, если это еда."
      frames_en:
        - "Crafting before the village — engineering theater."
        - "Encore if it is food."
    - weight: 50
      frames:
        - "Скрафтили. Мы уже придумали, зачем вам это… шучу. Или нет."
      frames_en:
        - "Crafted. We already invented why you need it… joking. Or not."

- key: D14
  title: "Mount a Horse"
  category: vanilla_event
  status: active
  trigger: "EntityMountEvent horse"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "В седло — и пыль столбом, как сплетни! Не топчите грядки галопом."
      frames_en:
        - "Into the saddle — dust like gossip! Do not stomp crops at a gallop."
    - weight: 50
      frames:
        - "Конь фыркнул вашими амбициями."
        - "Мы машем с безопасной бровки."
      frames_en:
        - "The horse snorted your ambitions."
        - "We wave from a safe roadside."
    - weight: 50
      frames:
        - "Кавалерия прибыла. Пехота деревни салютует."
        - "Салют из лопат."
      frames_en:
        - "Cavalry arrived. Village infantry salutes."
        - "With shovels."

- key: D15
  title: "Mount a Boat"
  category: vanilla_event
  status: active
  trigger: "EntityMountEvent boat"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "В лодку — капитан площади выходит в рейс!"
        - "Весла есть? Или надежда?"
      frames_en:
        - "Into the boat — square captain sets sail!"
        - "Got oars? Or hope?"
    - weight: 50
      frames:
        - "Плавучий транспорт. Куры остаются на берегу завидовать."
        - "Правильно делают."
      frames_en:
        - "Floating transport. Chickens stay ashore to envy."
        - "Smart chickens."
    - weight: 50
      frames:
        - "Сели в лодку. Политика осталась на причале."
        - "Удачи на волнах лужи."
      frames_en:
        - "Boarded the boat. Politics stayed on the pier."
        - "Luck on puddle waves."

- key: D16
  title: "Mount a Mob"
  category: vanilla_event
  status: active
  trigger: "EntityMountEvent other"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Вы оседлали что-то странное — и нам странно смотреть."
        - "Держитесь крепче морали!"
      frames_en:
        - "You mounted something weird — and we look weird watching."
        - "Hold onto your morals!"
    - weight: 50
      frames:
        - "Транспорт не из каталога деревни."
        - "Билеты не продаём, советы — да."
      frames_en:
        - "Transport not in the village catalog."
        - "No tickets, but advice yes."
    - weight: 50
      frames:
        - "Едете верхом на сюрпризе. Мы снимаем шляпы."
        - "И прячем кур."
      frames_en:
        - "Riding a surprise. We tip our hats."
        - "And hide the chickens."

- key: D17
  title: "Play a Note Block"
  category: vanilla_event
  status: active
  trigger: "NoteBlockEvent.Play"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Нота из блока — концерт без разрешения мэра!"
        - "Мы всё равно подпеваем фальшиво."
      frames_en:
        - "A note-block note — concert without the mayor's permit!"
        - "We still sing along off-key."
    - weight: 50
      frames:
        - "Музыка площади. Свиньи в восторге, куры в шоке."
        - "Ещё раз, только тише… или громче."
      frames_en:
        - "Square music. Pigs thrilled, chickens shocked."
        - "Again, quieter… or louder."
    - weight: 50
      frames:
        - "Звук такой, будто колокол решил сыграть джаз. Одобряем экспериментально."
      frames_en:
        - "Sounds like the bell tried jazz. Experimentally approved."

- key: D18
  title: "Throw an Item"
  category: vanilla_event
  status: active
  trigger: "ItemTossEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Выбросили вещь — рынок слёз и халявы открыт!"
        - "Мы не подбираем. Почти."
      frames_en:
        - "You tossed an item — market of tears and freebies is open!"
        - "We do not pick it up. Almost."
    - weight: 50
      frames:
        - "Предмет полетел. Достоинство — за ним."
        - "Поднимите, пока свиньи не написали заявление."
      frames_en:
        - "The item flew. Dignity followed."
        - "Pick it up before pigs file a claim."
    - weight: 50
      frames:
        - "Бросок от сердца… или от переполненного инвентаря."
        - "Понятно и без слов."
      frames_en:
        - "A throw from the heart… or a full inventory."
        - "Clear without words."

- key: D19
  title: "Tool Breaks"
  category: vanilla_event
  status: active
  trigger: "PlayerDestroyItemEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Инструмент сломался — минута молчания для рукоятки."
        - "Запасной есть? Или характер?"
      frames_en:
        - "Tool broke — a moment of silence for the handle."
        - "Got a spare? Or just attitude?"
    - weight: 50
      frames:
        - "Хрусь — и прогресс встал на одной ноге."
        - "Кузница вас уже вызывает взглядом."
      frames_en:
        - "Crack — and progress stands on one leg."
        - "The forge is already staring at you."
    - weight: 50
      frames:
        - "Сломанный инструмент — лучший учитель терпения."
        - "И повод зайти к кузнецу с изумрудами."
      frames_en:
        - "A broken tool is the best patience teacher."
        - "And a reason to visit the smith with emeralds."

- key: D20
  title: "Brew a Potion"
  category: vanilla_event
  status: active
  trigger: "PlayerBrewedPotionEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Зелье готово — запах науки и лёгкой беды."
        - "Не пейте рядом с колодцем, вдруг сработает дважды."
      frames_en:
        - "Potion ready — smell of science and mild trouble."
        - "Do not drink by the well; it might work twice."
    - weight: 50
      frames:
        - "Варите чудеса. Мы варим сплетни параллельно."
        - "Обмен рецептами?"
      frames_en:
        - "You brew wonders. We brew gossip in parallel."
        - "Trade recipes?"
    - weight: 50
      frames:
        - "Бутылочка с характером. Этикетку читайте вслух."
        - "Для храбрости площади."
      frames_en:
        - "A bottle with attitude. Read the label aloud."
        - "For the square's courage."

- key: D21
  title: "Land a Critical Hit"
  category: vanilla_event
  status: active
  trigger: "CriticalHitEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Крит! Даже воздух сказал: ай. Красиво. Жестоко. Эффективно."
      frames_en:
        - "Crit! Even the air said ouch. Pretty. Cruel. Effective."
    - weight: 50
      frames:
        - "Удар с изюминкой. Изюминку мы не просили, но оценили. Продолжайте мимо нас."
      frames_en:
        - "A hit with real flair. We did not ask for flair, but we rate it. Keep going past us."
    - weight: 50
      frames:
        - "Критический момент боя и нашего спокойствия."
        - "Щит деревни — это вы сегодня."
      frames_en:
        - "Critical moment for the fight and our calm."
        - "You are the village shield today."

- key: D22
  title: "Sweep Attack"
  category: vanilla_event
  status: active
  trigger: "SweepAttackEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Размашистый удар — веер неприятностей для врагов!"
        - "Для травы тоже, кстати."
      frames_en:
        - "A sweep attack — a fan of trouble for foes!"
        - "For grass too, by the way."
    - weight: 50
      frames:
        - "Взмах как метла героя. Двор чище, монстры нет. Спасибо от забора."
      frames_en:
        - "Sweep like a hero's broom. Yard cleaner, monsters not. Thanks from the fence."
    - weight: 50
      frames:
        - "Широкий замах. Узкий шанс увернуться у крипера."
        - "Мы болеем из укрытия."
      frames_en:
        - "Wide swing. Narrow dodge chance for the creeper."
        - "We cheer from cover."

- key: D23
  title: "Lightning Hits Nearby"
  category: vanilla_event
  status: active
  trigger: "EntityStruckByLightningEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Молния рядом — волосы и сплетни дыбом!"
        - "Кто заказывал световое шоу?"
      frames_en:
        - "Lightning nearby — hair and gossip stand up!"
        - "Who ordered the light show?"
    - weight: 50
      frames:
        - "Гром как колокол, только злее."
        - "Прячьте железо и гордость."
      frames_en:
        - "Thunder like the bell, only angrier."
        - "Hide iron and pride."
    - weight: 50
      frames:
        - "Небо хлопнуло. Мы подпрыгнули синхронно."
        - "Запишем в хронику: было громко."
      frames_en:
        - "The sky clapped. We jumped in sync."
        - "Chronicle note: it was loud."

- key: D24
  title: "Animals Have a Baby"
  category: vanilla_event
  status: active
  trigger: "BabyEntitySpawnEvent"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Малыш у животных! Деревня официально в умилении. Имена предлагать будем голосованием."
      frames_en:
        - "An animal baby! Village officially melting. We will vote on names."
    - weight: 50
      frames:
        - "Новорождённый хвостик. Сердца растаяли быстрее масла."
        - "Кормите правильно, герои фермы."

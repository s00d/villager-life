# Phase S — the elected mayor (village/home/Mayors.java): election, the hall, the morning speech, the round after
# work, weddings, funerals, resigning. A man speaks as `mayor`, a woman mayor as `woman` (same titles); the village
# answers as `villager` / `woman`.

- key: S01
  id: s_elect
  title: "Mayor Elected"
  category: home
  status: active
  trigger: "a villager without a trade is elected mayor of its village"
  speaker: mayor
  variants:
    - weight: 50
      frames:
        - "[clears throat] Благодарю, благодарю! Я не подведу. Наверное."
      frames_en:
        - "[clears throat] Thank you, thank you! I won't let you down. Probably."
    - weight: 50
      frames:
        - "Мэр! Я мэр! Кто-нибудь, запишите это."
      frames_en:
        - "Mayor! I'm the mayor! Somebody write that down."
    - weight: 50
      frames:
        - "Работы у меня не было, зато теперь есть должность."
      frames_en:
        - "I had no job, and now I have an office."
    - weight: 50
      frames:
        - "[proud] Обещаю: тёплые дома, полные кладовые и поменьше криперов."
      frames_en:
        - "[proud] I promise warm houses, full pantries and fewer creepers."
- key: S02
  id: s_w_elect
  title: "Mayor Elected"
  category: home
  status: active
  trigger: "a woman without a trade is elected mayor of her village"
  speaker: woman
  variants:
    - weight: 50
      frames:
        - "[clears throat] Спасибо за доверие! Порядок наведу быстро."
      frames_en:
        - "[clears throat] Thank you for your trust! I'll have this place in order in no time."
    - weight: 50
      frames:
        - "Мэр? Я? Ну что ж, кто-то же должен за вами присматривать."
      frames_en:
        - "Mayor? Me? Well, somebody has to keep an eye on you lot."
    - weight: 50
      frames:
        - "[proud] Первым делом — чистые улицы. Вторым — пироги на площади."
      frames_en:
        - "[proud] First, clean streets. Second, pies at the square."
- key: S03
  id: s_cheer
  title: "Villager Cheers the New Mayor"
  category: home
  status: active
  trigger: "a villager cheers the newly elected mayor"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "[cheering] Да здравствует мэр!"
      frames_en:
        - "[cheering] Long live the mayor!"
    - weight: 50
      frames:
        - "Ну, хоть кто-то теперь будет отвечать за колокол."
      frames_en:
        - "Well, at least someone's in charge of the bell now."
    - weight: 50
      frames:
        - "Я за него голосовал! Кажется."
      frames_en:
        - "I voted for him! I think."
- key: S04
  id: s_w_cheer
  title: "Villager Cheers the New Mayor"
  category: home
  status: active
  trigger: "a woman cheers the newly elected mayor"
  speaker: woman
  variants:
    - weight: 50
      frames:
        - "[cheering] Поздравляю! Только не зазнавайтесь."
      frames_en:
        - "[cheering] Congratulations! Just don't let it go to your head."
    - weight: 50
      frames:
        - "Наконец-то в деревне будет порядок!"
      frames_en:
        - "At last there'll be some order in this village!"
    - weight: 50
      frames:
        - "Мэр! Надо срочно испечь торт."
      frames_en:
        - "A mayor! I must bake a cake at once."
- key: S05
  id: s_stone
  title: "Mayor Lays the First Stone"
  category: home
  status: active
  trigger: "the mayor starts building the mayor's hall"
  speaker: mayor
  variants:
    - weight: 50
      frames:
        - "Мэру нужен дом с балконом. Для речей, разумеется."
      frames_en:
        - "A mayor needs a house with a balcony. For speeches, of course."
    - weight: 50
      frames:
        - "Закладываю первый камень! Остальные тоже заложу я."
      frames_en:
        - "I lay the first stone! And the rest of them too, it seems."
    - weight: 50
      frames:
        - "Здесь будет ратуша. Ну, большой дом. С флагами!"
      frames_en:
        - "Here stands the town hall. Well, a big house. With banners!"
- key: S06
  id: s_w_stone
  title: "Mayor Lays the First Stone"
  category: home
  status: active
  trigger: "a woman mayor starts building the mayor's hall"
  speaker: woman
  variants:

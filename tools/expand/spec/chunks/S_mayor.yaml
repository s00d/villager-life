        - "Ратуша готова. Заходите, только ноги вытирайте."
      frames_en:
        - "The hall is ready. Come in, but wipe your feet."
- key: S09
  id: s_speech
  title: "Mayor Morning Speech"
  category: home
  status: active
  trigger: "mornings the mayor gives a little speech at the bell"
  speaker: mayor
  variants:
    - weight: 50
      frames:
        - "[clears throat] Граждане! Новый день, новые изумруды. За работу!"
      frames_en:
        - "[clears throat] Citizens! A new day, new emeralds. To work!"
    - weight: 50
      frames:
        - "Доброе утро, деревня! Сегодня никто не дразнит големов."
      frames_en:
        - "Good morning, village! Today nobody teases the golems."
    - weight: 50
      frames:
        - "Сводка: урожай растёт, колокол звонит, мэр бодр."
      frames_en:
        - "The news: the crops are growing, the bell is ringing, the mayor is awake."
    - weight: 50
      frames:
        - "Напоминаю: двери на ночь закрывать. Особенно от зомби."
      frames_en:
        - "A reminder: shut your doors at night. Especially against zombies."
- key: S10
  id: s_w_speech
  title: "Mayor Morning Speech"

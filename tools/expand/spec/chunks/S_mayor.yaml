    - weight: 50
      frames:
        - "Красные знамёна, ковровая дорожка... Я тронут."
      frames_en:
        - "Red banners, a carpet runner... I'm touched."
    - weight: 50
      frames:
        - "Двери ратуши всегда открыты. Кроме ночи."
      frames_en:
        - "The doors of the hall are always open. Except at night."

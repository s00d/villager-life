      frames_en:
        - "Go away, meanie!"
    - weight: 50
      frames:
        - "Я вырасту и всем покажу!"
      frames_en:
        - "When I grow up, I'll show everyone!"
    - weight: 50
      frames:
        - "Тебе больно? Я подую, и пройдёт."
      frames_en:
        - "Does it hurt? I'll blow on it and it'll go away."
    - weight: 50
      frames:
        - "Стражник! Голем! Кто-нибудь!"
      frames_en:
        - "Guard! Golem! Somebody!"
    - weight: 50
      frames:
        - "Так нельзя! Это плохой поступок!"
      frames_en:
        - "You can't do that! That's a bad thing to do!"
    - weight: 50
      frames:
        - "Я тебя больше не люблю!"
      frames_en:
        - "I don't like you anymore!"
    - weight: 50
      frames:
        - "Отстань от него!"
      frames_en:
        - "Leave him alone!"
    - weight: 50
      frames:
        - "Сейчас как дам по коленке!"
      frames_en:
        - "I'll kick your knee, I will!"
    - weight: 50
      frames:
        - "Ты что, не знаешь, что драться плохо?"
      frames_en:
        - "Don't you know fighting is bad?"


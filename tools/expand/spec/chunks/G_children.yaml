# Phase G — children's own lines, voiced with speaker/<lang>/child.
# G01-G20 and G23 follow an adult line (ContextualDialogueController.CHILD_ECHOES); G21-G22 are a child's own walk.

- key: G01
  id: kid_monster
  title: "Kid Scared of a Monster"
  category: child
  status: active
  trigger: "adult reacts to a monster or panics; a child nearby follows"
  speaker: child
  variants:
    - weight: 50
      frames:
        - "Мама! Там чудище!"
      frames_en:
        - "Mom! There's a monster!"
    - weight: 50
      frames:
        - "Я не боюсь! Ну... чуть-чуть боюсь."
      frames_en:
        - "I'm not scared! Well... maybe a little."
    - weight: 50
      frames:
        - "Прячемся под кроватью, быстро!"
      frames_en:
        - "Hide under the bed, quick!"
    - weight: 50
      frames:
        - "Оно на меня посмотрело! Оно точно посмотрело!"
      frames_en:
        - "It looked at me! It totally looked at me!"
    - weight: 50
      frames:
        - "Если зажмуриться, оно меня не увидит."
      frames_en:
        - "If I close my eyes, it can't see me."
    - weight: 50
      frames:
        - "Папа, а оно кусается?"
      frames_en:
        - "Dad, does it bite?"
    - weight: 50
      frames:
        - "Уходи! Здесь дети живут!"
      frames_en:
        - "Go away! Kids live here!"
    - weight: 50
      frames:
        - "Я сейчас позову голема, так и знай!"
      frames_en:
        - "I'm gonna call the golem, you know!"
    - weight: 50
      frames:
        - "Оно страшнее, чем в сказке."
      frames_en:
        - "It's scarier than in the stories."
    - weight: 50
      frames:
        - "Я за тобой спрячусь, ладно?"
      frames_en:
        - "I'll hide behind you, okay?"
    - weight: 50
      frames:
        - "Ой-ой-ой, бежим домой!"
      frames_en:
        - "Uh-oh, uh-oh, run home!"
    - weight: 50
      frames:
        - "А можно я сегодня с вами посплю?"
      frames_en:
        - "Can I sleep with you tonight?"

- key: G02

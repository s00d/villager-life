# Phase L — home life: children at dinner, at school, with toys and new rooms (speaker child).

- key: L23
  id: kid_dinner
  title: "Kid Eats Dinner"
  category: home
  status: active
  trigger: "a child eats the meal its mother brings"
  speaker: child
  variants:
    - weight: 50
      frames:
        - "Ням-ням! Мама, ещё!"
      frames_en:
        - "Yum yum! Mom, more!"
    - weight: 50
      frames:
        - "Самая вкусная еда на свете!"
      frames_en:
        - "The best food in the world!"
    - weight: 50
      frames:
        - "А десерт будет?"
      frames_en:
        - "Is there dessert?"
    - weight: 50
      frames:
        - "Я всё съел! Даже морковку!"
      frames_en:
        - "I ate it all! Even the carrot!"
    - weight: 50
      frames:
        - "Спасибо, мамочка!"
      frames_en:
        - "Thank you, mommy!"
    - weight: 50
      frames:
        - "Теперь я сильный, как голем!"
      frames_en:
        - "Now I'm strong like a golem!"


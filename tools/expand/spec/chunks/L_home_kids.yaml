        - "Daddy's home! Hooray!"
    - weight: 50
      frames:
        - "Папа, покатай меня на плечах!"
      frames_en:
        - "Daddy, give me a piggyback ride!"
    - weight: 50
      frames:
        - "Папа, что ты мне принёс?"
      frames_en:
        - "Daddy, what did you bring me?"
    - weight: 50
      frames:
        - "Я тебя ждал весь день!"
      frames_en:
        - "I waited for you all day!"
    - weight: 50

- key: L26
  id: kid_school
  title: "Kid at School"
  category: home
  status: active
  trigger: "a child answers the librarian's lesson"
  speaker: child
  variants:
    - weight: 50
      frames:
        - "Я знаю! Я знаю! Можно я скажу?"
      frames_en:
        - "I know! I know! Can I answer?"
    - weight: 50
      frames:
        - "А можно на перемену?"
      frames_en:
        - "Can we have a break?"
    - weight: 50
      frames:
        - "Я выучил все буквы! Ну, половину."
      frames_en:
        - "I learned all the letters! Well, half."
    - weight: 50
      frames:
        - "Учитель, а драконы бывают добрые?"
      frames_en:
        - "Teacher, are there any nice dragons?"
    - weight: 50
      frames:
        - "Скучно… Ой, то есть, очень интересно!"
      frames_en:
        - "Boring… I mean, very interesting!"
    - weight: 50
      frames:
        - "Когда вырасту, тоже стану библиотекарем."
      frames_en:
        - "When I grow up, I'll be a librarian too."


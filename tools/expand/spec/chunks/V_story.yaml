    - weight: 50
      frames:
        - "Потанцуем? Ну давай, не стесняйся!"
      frames_en:
        - "Shall we dance? Come on, don't be shy!"
    - weight: 50
      frames:
        - "Какой стол! Вся деревня старалась."
      frames_en:
        - "What a spread! The whole village pitched in."

# The town's storyteller (TownStory): a lost child, a storm, a feast, an illness, a neighbours' dispute.

- key: V01
  id: st_lost
  title: "Where Is My Child"
  category: home
  status: active
  trigger: "a mother finds her child gone (TownStory: a lost child)"
  speaker: woman
  variants:
    - weight: 50
      frames:
        - "[gasp] Где мой малыш? Только что был тут!"
      frames_en:
        - "[gasp] Where's my little one? They were right here!"
    - weight: 50
      frames:
        - "Кто-нибудь видел моего ребёнка? Ну пожалуйста!"
      frames_en:
        - "Has anyone seen my child? Please!"
    - weight: 50
      frames:
        - "[sigh] Опять убежал(а) играть... А если в лес?"
      frames_en:
        - "[sigh] Off playing again... What if they went into the woods?"
- key: V02
  id: st_lost_m
  title: "Where Is My Child"
  category: home
  status: active
  trigger: "a father finds his child gone"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Ребёнка не видели? Маленький такой, шустрый."
      frames_en:
        - "Seen my child? Little one, quick as anything."
    - weight: 50
      frames:
        - "[sigh] Пойду искать. Далеко уйти не мог(ла)."
      frames_en:
        - "[sigh] I'll go and look. They can't have gone far."
- key: V03
  id: st_found
  title: "Kid Is Found"
  category: home
  status: active
  trigger: "a lost child is found, by the player or by the family"
  speaker: child
  variants:
    - weight: 50
      frames:
        - "Я не терялся! Я просто далеко гулял!"
      frames_en:
        - "I wasn't lost! I just went for a long walk!"
    - weight: 50
      frames:
        - "[sniff] Я хочу домой. Там мама."
      frames_en:
        - "[sniff] I want to go home. Mum's there."
    - weight: 50
      frames:
        - "Ты меня нашёл! Мы в прятки играли?"
      frames_en:
        - "You found me! Were we playing hide and seek?"
- key: V04
  id: st_thanks
  title: "Thanks for Finding the Child"
  category: home
  status: active
  trigger: "the mother thanks the player who found her lost child"
  speaker: woman
  variants:
    - weight: 50
      frames:
        - "Спасибо тебе! Я уже не знала, что думать."
      frames_en:
        - "Thank you! I didn't know what to think any more."
    - weight: 50
      frames:
        - "[sigh] Нашёлся... Ты наш спаситель, сосед."
      frames_en:
        - "[sigh] Found... You're our saviour, neighbour."
- key: V05
  id: st_thanks_m
  title: "Thanks for Finding the Child"
  category: home
  status: active
  trigger: "the father thanks the player who found his lost child"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Спасибо, сосед. Я твой должник."
      frames_en:
        - "Thank you, neighbour. I owe you one."
    - weight: 50
      frames:
        - "Нашёлся! Ну, теперь только за руку гулять будешь."
      frames_en:
        - "Found! Well, from now on you walk holding my hand."
- key: V06
  id: st_storm
  title: "Storm Took the Roof"
  category: home
  status: active
  trigger: "a storm tore blocks off a villager's roof (TownStory)"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "[groan] Ну вот, крышу сорвало. Опять чинить."
      frames_en:
        - "[groan] There, the roof's gone. Mending again."
    - weight: 50
      frames:
        - "Ветер-то какой! Половина крыши в соседском огороде."
      frames_en:
        - "What a wind! Half my roof's in the neighbour's garden."
    - weight: 50
      frames:
        - "Капает прямо на кровать. Завтра залатаю."
      frames_en:
        - "It's dripping right on the bed. I'll patch it tomorrow."
- key: V07
  id: st_storm_w
  title: "Storm Took the Roof"
  category: home
  status: active
  trigger: "a storm tore blocks off a woman's roof"
  speaker: woman
  variants:
    - weight: 50
      frames:
        - "[gasp] Крыша! Говорила же — прибей покрепче!"
      frames_en:
        - "[gasp] The roof! I said nail it down properly!"
    - weight: 50
      frames:
        - "Теперь в спальне видно небо. Романтично, но мокро."
      frames_en:
        - "Now you can see the sky from the bedroom. Romantic, but wet."
    - weight: 50
      frames:
        - "Ой, всё промокнет... Надо чинить, и поскорее."
      frames_en:
        - "Oh, everything will get soaked... It needs mending, and soon."
- key: V08
  id: st_feast
  title: "Mayor Opens the Feast"
  category: home
  status: active
  trigger: "the mayor opens a harvest feast on the square"
  speaker: mayor
  variants:
    - weight: 50
      frames:
        - "Друзья! Урожай собран — пируем! Всем к площади!"
      frames_en:
        - "Friends! The harvest is in, so let's feast! Everyone to the square!"
    - weight: 50
      frames:
        - "[clears throat] Сегодня никаких дел. Сегодня — праздник!"
      frames_en:
        - "[clears throat] No work today. Today is a feast!"
    - weight: 50
      frames:
        - "Ешьте, пейте, танцуйте! Казна угощает. Немножко."
      frames_en:
        - "Eat, drink, dance! The treasury is paying. A little."
- key: V09
  id: st_feast_w
  title: "Mayor Opens the Feast"
  category: home
  status: active
  trigger: "a woman mayor opens a harvest feast"
  speaker: woman
  variants:
    - weight: 50
      frames:
        - "Дорогие мои! Сегодня праздник урожая!"
      frames_en:
        - "My dears! Today is the harvest feast!"
    - weight: 50
      frames:
        - "Все на площадь! Пироги стынут."
      frames_en:
        - "Everyone to the square! The pies are getting cold."
- key: V10
  id: st_party
  title: "Harvest Feast"
  category: home
  status: active
  trigger: "a villager enjoys the harvest feast on the square"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "[laughs] Вот это я понимаю — праздник!"
      frames_en:
        - "[laughs] Now that's what I call a feast!"
    - weight: 50
      frames:
        - "Кто испёк этот пирог? Хочу ещё кусок."
      frames_en:
        - "Who baked this pie? I want another slice."
    - weight: 50
      frames:
        - "Музыка, еда, соседи... Хорошо живём!"
      frames_en:
        - "Music, food, neighbours... We live well!"

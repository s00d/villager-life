        - "Mum says the spire was stronger today. It'll be weaker tomorrow, right?"
    - weight: 50
      frames:
        - "Тише! Папа отдыхает после башни. Он храпит, значит, всё хорошо."
      frames_en:
        - "Shh! Dad's resting after the spire. He's snoring, so he's fine."
    - weight: 50
      frames:
        - "Подарков нет, зато мама дома. Это лучше подарка."
      frames_en:
        - "No presents, but Mum's home. That's better than presents."
- key: X19
  id: spr_find
  title: "Back With a Find"
  category: home
  status: active
  trigger: "a villager comes back from the spire with something found inside"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "[proud] Смотрите, что я нашёл! Не знаю, что это, но оно красивое."
      frames_en:
        - "[proud] Look what I found! No idea what it is, but it's beautiful."

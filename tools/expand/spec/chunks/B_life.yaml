        - "Не пейте, даже если очень космично хочется."
      frames_en:
        - "An oxygen bucket — rare orbital souvenir."
        - "Do not drink it, even if it feels cosmic."
    - weight: 50
      frames:
        - "Топливо для ракет рядом с сеном. Смелые."
        - "Мы отойдём на всякий случай."

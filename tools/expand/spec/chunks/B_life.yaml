        - "And sometimes roofs."

- key: B36
  title: "Wear a Huge Backpack"
  category: pack_cat
  status: active
  trigger: "soft B36"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Рюкзак размером с амбар — вы переезжаете?"
        - "Или амбар переезжает с вами?"
      frames_en:
        - "A backpack the size of a barn — are you moving?"
        - "Or is the barn moving with you?"
    - weight: 50
      frames:
        - "Столько карманов, а доброта — в одном? Шутка. Надеюсь, доброты тоже много."
      frames_en:
        - "So many pockets, and kindness fits in one? Joke. I hope there is plenty of kindness too."
    - weight: 50
      frames:
        - "Склад на плечах. Лавки завидуют молча."
        - "Мы завидуем вслух, без стеснения."
      frames_en:
        - "A warehouse on your shoulders. Shops envy silently."
        - "We envy out loud."

- key: B37

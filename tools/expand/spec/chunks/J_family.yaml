      frames_en:
        - "Good morning, sunshine. It smells like pancakes!"
    - weight: 50
      frames:
        - "Я не храпел. Это был ветер."
      frames_en:
        - "I wasn't snoring. That was the wind."
    - weight: 50
      frames:
        - "Уже иду, уже иду!"
      frames_en:
        - "Coming, coming!"
    - weight: 50
      frames:
        - "Ты самое лучшее, что бывает по утрам."
      frames_en:
        - "You're the best thing about mornings."
    - weight: 50
      frames:
        - "Сегодня принесу тебе что-нибудь с рынка."

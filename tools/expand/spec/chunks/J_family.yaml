# Phase J — a family's men and guests (speaker villager) at Family moments; see Family.java.

- key: J01
  id: m_courting
  title: "Man Courting"
  category: family
  status: active
  trigger: "a courting man answers his sweetheart"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Я сорвал тебе ромашку. Последнюю на лугу!"
      frames_en:
        - "I picked you a daisy. The last one in the meadow!"
    - weight: 50
      frames:
        - "Пойдём, покажу, где растут самые сладкие ягоды."
      frames_en:
        - "Come on, I'll show you where the sweetest berries grow."
    - weight: 50
      frames:
        - "Ты сегодня красивее заката."
      frames_en:
        - "You're prettier than the sunset today."
    - weight: 50
      frames:
        - "Я умею печь хлеб! Ну, почти умею."
      frames_en:
        - "I can bake bread! Well, almost."
    - weight: 50
      frames:
        - "Можно я понесу твою корзинку?"
      frames_en:
        - "Can I carry your basket?"
    - weight: 50
      frames:
        - "С тобой и дождь не страшен."
      frames_en:
        - "With you, even rain isn't scary."
    - weight: 50
      frames:
        - "Завтра приду раньше всех. Обещаю."
      frames_en:
        - "I'll be here first thing tomorrow. I promise."
    - weight: 50
      frames:
        - "Я построю нам самый уютный дом."
      frames_en:
        - "I'll build us the coziest house."

- key: J02
  id: m_flower
  title: "Man Thanks for the Flower"
  category: family
  status: active
  trigger: "the player gives a courting man a flower or a cake"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Цветок! Отличная идея, подарю ей!"
      frames_en:
        - "A flower! Great idea, I'll give it to her!"
    - weight: 50
      frames:
        - "Торт? Это намёк? Тогда свадьба!"
      frames_en:
        - "A cake? Is that a hint? Then it's a wedding!"
    - weight: 50
      frames:
        - "Спасибо, друг! Ты настоящий сват."
      frames_en:
        - "Thanks, friend! You're a real matchmaker."
    - weight: 50
      frames:
        - "Она обожает такие. Откуда ты знал?"
      frames_en:
        - "She loves these. How did you know?"
    - weight: 50
      frames:
        - "С таким подарком она точно скажет да!"
      frames_en:
        - "With a gift like this, she'll surely say yes!"

- key: J03
  id: m_vow
  title: "Man Wedding Vow"
  category: family
  status: active
  trigger: "the groom's words at the bell"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Обещаю чинить крышу, даже в дождь."
      frames_en:
        - "I promise to fix the roof, even in the rain."
    - weight: 50
      frames:
        - "Ты моя самая большая удача."
      frames_en:
        - "You're my greatest luck."
    - weight: 50
      frames:
        - "Я самый счастливый житель на свете!"
      frames_en:
        - "I'm the happiest villager in the world!"
    - weight: 50
      frames:
        - "Обещаю никогда не храпеть. Ну, постараюсь."
      frames_en:
        - "I promise never to snore. Well, I'll try."
    - weight: 50
      frames:
        - "Теперь у нас общий дом и общая морковка."
      frames_en:
        - "Now we share a home and every carrot."
    - weight: 50
      frames:
        - "Звоните громче! Мы поженились!"
      frames_en:
        - "Ring it louder! We're married!"

- key: J04
  id: wedding_cheers
  title: "Wedding Cheers"
  category: family
  status: active
  trigger: "a guest cheers at a wedding"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Горько! То есть, ура молодым!"
      frames_en:
        - "Hooray for the happy couple!"
    - weight: 50
      frames:
        - "Какая красивая пара!"
      frames_en:
        - "What a lovely couple!"
    - weight: 50
      frames:
        - "Пусть у вас будет полный дом счастья!"
      frames_en:
        - "May your house be full of happiness!"
    - weight: 50
      frames:
        - "Я сейчас заплачу. От радости!"
      frames_en:
        - "I'm going to cry. From joy!"
    - weight: 50
      frames:
        - "Музыку! Танцуют все!"
      frames_en:
        - "Music! Everybody dance!"
    - weight: 50
      frames:
        - "Ну наконец-то! Мы ждали целых три дня!"
      frames_en:
        - "Finally! We waited three whole days!"
    - weight: 50
      frames:
        - "Совет да любовь!"
      frames_en:
        - "Love and happiness to you both!"

- key: J05

- key: J07
  id: m_widowed
  title: "Man Widowed"
  category: family
  status: active
  trigger: "a man's wife has died"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Её больше нет… Как же так?"
      frames_en:
        - "She's gone… How can this be?"
    - weight: 50
      frames:
        - "Я буду хранить её вещи. Все до одной."
      frames_en:
        - "I'll keep her things. Every single one."
    - weight: 50
      frames:
        - "Дети, теперь мы одни. Мы справимся."
      frames_en:
        - "Kids, it's just us now. We'll manage."
    - weight: 50
      frames:
        - "Без её песен дом совсем тихий."
      frames_en:
        - "Without her songs the house is so quiet."
    - weight: 50
      frames:
        - "Я никогда тебя не забуду."
      frames_en:
        - "I'll never forget you."

- key: J08
  id: m_defend_wife
  title: "Man Defends His Wife"
  category: family
  status: active
  trigger: "a man's wife is attacked nearby"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Не трогай мою жену!"
      frames_en:
        - "Don't you touch my wife!"
    - weight: 50
      frames:
        - "Дорогая, ты в порядке? Ах ты!"
      frames_en:
        - "Darling, are you all right? Why, you!"
    - weight: 50
      frames:
        - "Кто обидит её, будет иметь дело со мной!"
      frames_en:
        - "Anyone who hurts her answers to me!"
    - weight: 50
      frames:
        - "Голем! Сюда! Мою жену обижают!"
      frames_en:
        - "Golem! Over here! Someone's hurting my wife!"
    - weight: 50
      frames:
        - "Отойди от неё, пока я добрый!"
      frames_en:
        - "Get away from her while I'm still being nice!"
    - weight: 50
      frames:
        - "Я хоть и житель, но за жену постою!"
      frames_en:
        - "I may just be a villager, but I'll stand up for my wife!"

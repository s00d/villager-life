- key: M09
  id: m_greet
  title: "Shopkeeper Greets a Customer"
  category: home
  status: active
  trigger: "a player walks up to the counter"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Добрый день! Чем могу помочь?"
      frames_en:
        - "Good day! How can I help?"
    - weight: 50
      frames:
        - "О, покупатель! Посмотрите, свежий хлеб."
      frames_en:
        - "Oh, a customer! Have a look, fresh bread."
    - weight: 50
      frames:
        - "Продаёте? Покупаете? Я и то и другое люблю."
      frames_en:
        - "Selling? Buying? I like both."
    - weight: 50
      frames:
        - "Цены честные, монеты — круглые."
      frames_en:
        - "Fair prices, round coins."
- key: M10
  id: m_w_greet
  title: "Shopkeeper Greets a Customer"

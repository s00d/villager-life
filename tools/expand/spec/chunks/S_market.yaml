# Phase M — the village market (village/market): the shopkeeper and the stall, customers, wages paid by the mayor,
# the treasury's help, the caravan. A man keeper speaks as `villager`, a woman as `woman`; the mayor as `mayor`/`woman`.

- key: M01
  id: m_take
  title: "Shopkeeper Takes the Stall"
  category: home
  status: active
  trigger: "a villager without a trade becomes the village's shopkeeper"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Лавочник? Я? Ну, считать я умею. До десяти точно."
      frames_en:
        - "Shopkeeper? Me? Well, I can count. Up to ten, at least."
    - weight: 50
      frames:
        - "[happy] Своя лавка! Всю жизнь мечтал торговать хлебом."
      frames_en:
        - "[happy] A stall of my own! I've dreamed of selling bread all my life."
    - weight: 50
      frames:
        - "Деревня выросла — значит, ей нужна лавка. И я её поставлю."
      frames_en:
        - "The village has grown, so it needs a stall. And I'll be the one to build it."
- key: M02
  id: m_w_take
  title: "Shopkeeper Takes the Stall"
  category: home
  status: active
  trigger: "a woman without a trade becomes the village's shopkeeper"
  speaker: woman
  variants:
    - weight: 50
      frames:
        - "Лавочница! Ну наконец-то мне доверили кассу."
      frames_en:
        - "Shopkeeper! At last someone trusts me with the till."
    - weight: 50
      frames:
        - "[happy] Своя лавка! Вот теперь заживём."
      frames_en:
        - "[happy] A stall of my own! Now we'll get on in life."
    - weight: 50
      frames:
        - "Торговать буду честно. Почти всегда."
      frames_en:
        - "I'll trade honestly. Nearly always."
- key: M03
  id: m_lay
  title: "Shopkeeper Lays Out the Stall"
  category: home
  status: active
  trigger: "the shopkeeper starts building the stall near the bell"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Вот здесь, у колокола, все будут проходить мимо. Идеально."
      frames_en:
        - "Right here by the bell, everyone walks past. Perfect."
    - weight: 50
      frames:
        - "Прилавок, навес, пара бочек. Что может пойти не так?"
      frames_en:
        - "A counter, an awning, a couple of barrels. What could go wrong?"
    - weight: 50
      frames:
        - "[grunts] Лавка сама себя не построит."
      frames_en:
        - "[grunts] The stall won't build itself."
- key: M04
  id: m_w_lay
  title: "Shopkeeper Lays Out the Stall"
  category: home
  status: active
  trigger: "the shopkeeper starts building the stall near the bell"
  speaker: woman
  variants:
    - weight: 50
      frames:
        - "Навес будет в полоску. Красный с белым — это я решила."
      frames_en:
        - "The awning will be striped. Red and white, I've decided."
    - weight: 50
      frames:
        - "Тут, у колокола, место бойкое. Строю."
      frames_en:
        - "It's busy here by the bell. I'm building."
    - weight: 50
      frames:
        - "Ну-ка, где мои доски? Лавка ждать не будет."
      frames_en:
        - "Now, where are my planks? The stall won't wait."
- key: M05
  id: m_noroom
  title: "Shopkeeper Has No Room for the Stall"
  category: home
  status: active
  trigger: "no place for the stall near the bell; it looks again tomorrow"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "[sigh] У колокола ни клочка свободной земли. Завтра поищу ещё."
      frames_en:
        - "[sigh] Not a scrap of free ground by the bell. I'll look again tomorrow."
    - weight: 50
      frames:
        - "Всё застроено! Где мне ставить лавку, на крыше?"
      frames_en:
        - "Everything's built over! Where do I put the stall, on a roof?"
    - weight: 50
      frames:
        - "Места нет. Торговать пока буду с рук."
      frames_en:
        - "No room. I'll have to trade from my hands for now."
- key: M06
  id: m_w_noroom
  title: "Shopkeeper Has No Room for the Stall"
  category: home
  status: active
  trigger: "no place for the stall near the bell; it looks again tomorrow"
  speaker: woman
  variants:
    - weight: 50
      frames:
        - "[sigh] Ни одного свободного угла у колокола. Поищу завтра."
      frames_en:
        - "[sigh] Not one free corner by the bell. I'll look tomorrow."
    - weight: 50
      frames:
        - "Тесно у нас. Лавка подождёт, пока место найдётся."
      frames_en:
        - "It's cramped here. The stall will wait till there's room."
    - weight: 50
      frames:
        - "Опять всё занято. Ну что за деревня!"
      frames_en:
        - "Taken again. What a village!"
- key: M07
  id: m_open
  title: "Shopkeeper Opens the Stall"
  category: home
  status: active
  trigger: "the stall is finished and opens with full shelves"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "[proud] Лавка открыта! Хлеб, свечи, кровати — подходи, покупай!"
      frames_en:
        - "[proud] The stall is open! Bread, candles, beds, come and buy!"
    - weight: 50
      frames:
        - "Готово! Полки полные, касса звенит."
      frames_en:
        - "Done! The shelves are full and the till jingles."
    - weight: 50
      frames:
        - "Добро пожаловать в лучшую лавку деревни. Она же единственная."
      frames_en:
        - "Welcome to the best stall in the village. Also the only one."
- key: M08
  id: m_w_open
  title: "Shopkeeper Opens the Stall"
  category: home
  status: active
  trigger: "the stall is finished and opens with full shelves"

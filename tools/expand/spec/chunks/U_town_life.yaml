# Town life, second round: travellers at the tavern (Travellers), a rest at the tavern at noon and of an evening
# (TownLife), the town's flag (TownFlag). A man speaks as `villager`, a woman as `woman`, the mayor as `mayor`.

- key: U01
  id: tv_room
  title: "Traveller Takes a Room"
  category: home
  status: active
  trigger: "a traveller takes a room at the town's tavern of an evening"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Комнату на ночь, хозяин! Дорога была длинная."
      frames_en:
        - "A room for the night, landlord! It's been a long road."
    - weight: 50
      frames:
        - "[sigh] Наконец-то крыша над головой. Ноги гудят."
      frames_en:
        - "[sigh] A roof over my head at last. My feet are humming."
    - weight: 50
      frames:
        - "Славный городок. Посижу тут денёк-другой, погляжу."
      frames_en:
        - "A fine little town. I'll sit here a day or two and look about."
- key: U02
  id: tv_w_room
  title: "Traveller Takes a Room"
  category: home
  status: active
  trigger: "a woman traveller takes a room at the town's tavern"
  speaker: woman
  variants:
    - weight: 50
      frames:
        - "Комнату, пожалуйста. И чтобы окно на площадь."
      frames_en:
        - "A room, please. One with a window on the square."
    - weight: 50
      frames:
        - "[sigh] Сколько я прошла... Здесь хоть тепло."
      frames_en:
        - "[sigh] How far I've walked... At least it's warm here."
    - weight: 50
      frames:
        - "Какой уютный город. Может, задержусь."
      frames_en:
        - "What a cosy town. Maybe I'll stay a while."
- key: U03
  id: tv_ask
  title: "Traveller Asks to Stay"
  category: home
  status: active
  trigger: "a player talks to a traveller who would stay if given what it asks"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Остался бы, честное слово. Только уговорите меня как следует."
      frames_en:
        - "I'd stay, honest. You just have to talk me into it properly."
    - weight: 50
      frames:
        - "Хороший город. Но с пустыми руками на новом месте не начинают."
      frames_en:
        - "A good town. But you don't start out somewhere new empty-handed."
    - weight: 50
      frames:
        - "Принесёте, о чём прошу, и я ваш сосед."
      frames_en:
        - "Bring me what I asked for, and I'm your neighbour."
- key: U04
  id: tv_w_ask
  title: "Traveller Asks to Stay"
  category: home
  status: active
  trigger: "a player talks to a woman traveller who would stay if given what she asks"
  speaker: woman
  variants:
    - weight: 50
      frames:
        - "Я бы осталась. Но мне кое-что нужно для начала."
      frames_en:
        - "I'd stay. But I need a little something to start with."
    - weight: 50
      frames:
        - "Уговорите меня. Это несложно, если знать, чем."
      frames_en:
        - "Talk me into it. It isn't hard, if you know how."
    - weight: 50
      frames:
        - "Здесь мило. Принесите, что прошу, и останусь."
      frames_en:
        - "It's lovely here. Bring what I asked, and I'll stay."
- key: U05
  id: tv_stay
  title: "Traveller Settles"
  category: home
  status: active
  trigger: "a traveller agrees to settle in the town"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Решено! Остаюсь. Где тут у вас строят дома?"
      frames_en:
        - "It's settled! I'm staying. Where do you build houses round here?"
    - weight: 50
      frames:
        - "[laughs] Ну всё, уговорили. Больше никаких дорог!"
      frames_en:
        - "[laughs] All right, you've talked me round. No more roads!"
    - weight: 50
      frames:
        - "Спасибо, сосед. Я вас не подведу."
      frames_en:
        - "Thank you, neighbour. I won't let you down."
- key: U06
  id: tv_w_stay
  title: "Traveller Settles"
  category: home
  status: active
  trigger: "a woman traveller agrees to settle in the town"
  speaker: woman
  variants:
    - weight: 50
      frames:
        - "Остаюсь! Наконец-то свой угол будет."
      frames_en:
        - "I'm staying! A place of my own at last."
    - weight: 50
      frames:
        - "[laughs] Уговорили. Пора распаковывать сумки."
      frames_en:
        - "[laughs] You've talked me into it. Time to unpack my bags."
    - weight: 50
      frames:
        - "Спасибо вам. Здесь мне будет хорошо."
      frames_en:
        - "Thank you. I'll be happy here."
- key: U07
  id: tv_road
  title: "Traveller Tells of the Road"
  category: home
  status: active
  trigger: "a traveller at the tavern tells the townsfolk of the road of an evening"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "А за горами, говорят, деревня, где все жители — библиотекари. Скукота!"
      frames_en:
        - "Over the mountains, they say, there's a village where everyone's a librarian. How dull!"
    - weight: 50
      frames:
        - "Шёл я через болото, а там ведьма... Ладно, это долгая история."
      frames_en:
        - "I was crossing a swamp, and there was a witch... Well, that's a long story."
    - weight: 50
      frames:
        - "Видел я пустынный храм. Внутри пусто, а снаружи жарко."
      frames_en:
        - "I saw a desert temple once. Empty inside, and hot outside."
- key: U08
  id: tv_w_road
  title: "Traveller Tells of the Road"
  category: home
  status: active
  trigger: "a woman traveller at the tavern tells of the road"
  speaker: woman
  variants:
    - weight: 50
      frames:
        - "Я видела снежную деревню. Там даже куры в шубах!"
      frames_en:
        - "I saw a snowy village. Even the chickens wear fur coats there!"
    - weight: 50
      frames:
        - "В одном городе мэр носил две шляпы сразу. Представляете?"
      frames_en:
        - "In one town the mayor wore two hats at once. Can you imagine?"
    - weight: 50
      frames:
        - "Дорога учит одному: всегда бери с собой хлеб."
      frames_en:
        - "The road teaches you one thing: always carry bread."
- key: U09
  id: tv_rest
  title: "Rests at the Tavern"
  category: home
  status: active
  trigger: "a villager sits down at the town's tavern at noon or of an evening"
  speaker: villager
  variants:
    - weight: 50
      frames:
        - "Ох, хорошо посидеть после работы."
      frames_en:
        - "Oh, it's good to sit down after work."
    - weight: 50
      frames:
        - "[laughs] За нашу деревню! И за тех, кто её строит."
      frames_en:
        - "[laughs] To our village! And to those who build it."
    - weight: 50
      frames:
        - "Здесь лучший суп в округе. Ну, единственный."
      frames_en:
        - "Best soup around here. Well, the only soup."
    - weight: 50
      frames:
        - "Говорят, завтра караван придёт. Посмотрим."
      frames_en:
        - "They say the caravan comes tomorrow. We'll see."
- key: U10
  id: tv_w_rest
  title: "Rests at the Tavern"
  category: home
  status: active
  trigger: "a woman sits down at the town's tavern"
  speaker: woman
  variants:
    - weight: 50
      frames:
        - "Наконец-то присесть. Весь день на ногах."

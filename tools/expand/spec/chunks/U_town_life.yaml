      frames:
        - "У нашего города теперь есть флаг! Повесим его повыше."
      frames_en:
        - "Our town has a flag now! We'll hang it up high."
    - weight: 50
      frames:
        - "Какие цвета! Прямо гордость берёт."
      frames_en:
        - "What colours! It fills me with pride."
    - weight: 50
      frames:
        - "Флаг над ратушей, флаг на воротах. Вот это город!"
      frames_en:
        - "A flag over the hall, a flag on the gates. Now that's a town!"

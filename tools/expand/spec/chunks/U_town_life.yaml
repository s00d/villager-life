        - "[laughs] So, tell me, what's new in town?"
    - weight: 50
      frames:
        - "Чай здесь вкусный. Почти как дома."
      frames_en:
        - "The tea here is good. Almost like home."
    - weight: 50
      frames:
        - "Посижу немножко и обратно к делам."
      frames_en:

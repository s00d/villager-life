    - weight: 50
      frames:
        - "Это нечестно, ты подглядывал!"
      frames_en:
        - "No fair, you peeked!"
    - weight: 50
      frames:
        - "Я специально высунулся!"
      frames_en:
        - "I let you find me on purpose!"
    - weight: 50
      frames:
        - "Ладно, в следующий раз спрячусь лучше."
      frames_en:
        - "Fine, next time I'll hide better."
    - weight: 50
      frames:
        - "Хи-хи! Как ты догадался?"
      frames_en:

  title: "Kid Found You"
  category: home
  status: active
  trigger: "the seeker finds a hiding child"
  speaker: child
  variants:
    - weight: 50
      frames:
        - "Нашёл! Нашёл!"
      frames_en:
        - "Found you! Found you!"
    - weight: 50
      frames:
        - "Ага, попался!"
      frames_en:
        - "Aha, got you!"
    - weight: 50
      frames:
        - "Я видел твой нос из-за угла!"
      frames_en:
        - "I saw your nose round the corner!"
    - weight: 50
      frames:
        - "Ты плохо спрятался!"
      frames_en:
        - "You didn't hide very well!"
    - weight: 50
      frames:
        - "Тук-тук, ты водишь! Ой, нет, я вожу."
      frames_en:

  speaker: child
  variants:
    - weight: 50
      frames:
        - "Где мой друг? Он больше не придёт?"
      frames_en:
        - "Where's my friend? Isn't he coming back?"
    - weight: 50
      frames:
        - "Я буду тебя помнить. Всегда."
      frames_en:
        - "I'll remember you. Always."
    - weight: 50
      frames:
        - "Без него так тихо..."
      frames_en:
        - "It's so quiet without him..."
    - weight: 50
      frames:

# Phase I — women's own voice, speaker/<lang>/woman. Adult lines become these through Family.WOMAN_LINES;
# I19-I26 are family moments started by com.vnap.dialogue.Family.

- key: I01
  id: w_greet
  title: "Woman Greets the Player"
  category: woman
  status: active
  trigger: "player approaches, stares at or nudges a woman"
  speaker: woman
  variants:
    - weight: 50
      frames:
        - "О, привет! Заходи, не стесняйся."
      frames_en:
        - "Oh, hello! Come in, don't be shy."
    - weight: 50
      frames:
        - "Здравствуй, путник. Ты сегодня какой-то задумчивый."
      frames_en:
        - "Hello, traveler. You look thoughtful today."
    - weight: 50
      frames:
        - "Хмм… Опять ты? Ну, рассказывай, что нового."
      frames_en:
        - "Hmm… you again? Well, tell me what's new."
    - weight: 50
      frames:
        - "Чего так смотришь? У меня что-то на носу?"
      frames_en:
        - "Why are you staring? Is something on my nose?"
    - weight: 50
      frames:
        - "Добрый день! Как дорога, не устал?"
      frames_en:
        - "Good day! How was the road, are you tired?"
    - weight: 50
      frames:
        - "Ой, напугал! Подкрадываться нехорошо."
      frames_en:
        - "Oh, you scared me! Sneaking up is not nice."
    - weight: 50
      frames:
        - "Привет-привет! Поможешь мне с корзинкой?"
      frames_en:
        - "Hi there! Will you help me with my basket?"

- key: I02
  id: w_trade
  title: "Woman Starts Trading"
  category: woman
  status: active
  trigger: "a woman starts trading with a friendly player"
  speaker: woman
  variants:
    - weight: 50
      frames:
        - "Хмм… Опять пришёл? Ну, показывай, что принёс."
      frames_en:
        - "Hmm… back again? Well, let's see what you've brought."
    - weight: 50
      frames:
        - "О-о, изумруды! Ладно, давай посмотрим, что я могу предложить."
      frames_en:
        - "Ooh, emeralds! All right, let's see what I can offer you."
    - weight: 50
      frames:
        - "Для тебя у меня всегда найдётся что-нибудь хорошее."
      frames_en:
        - "I always have something nice for you."
    - weight: 50
      frames:
        - "Выбирай не спеша, всё свежее."
      frames_en:
        - "Take your time, everything is fresh."
    - weight: 50
      frames:
        - "Только не торгуйся слишком сильно, я сегодня добрая."
      frames_en:
        - "Don't haggle too hard, I'm feeling kind today."
    - weight: 50
      frames:
        - "Моему мужу не говори, но тебе скидка."
      frames_en:
        - "Don't tell my husband, but you get a discount."
    - weight: 50
      frames:
        - "Ну что, обмен? Я люблю, когда всё честно."
      frames_en:
        - "So, a trade? I like it when things are fair."

- key: I03
  id: w_trade_wary
  title: "Woman Trades Warily"
  category: woman
  status: active
  trigger: "a woman trades with a player of low reputation"
  speaker: woman
  variants:
    - weight: 50
      frames:
        - "Хм. Торговать будем, но я слежу за тобой."
      frames_en:
        - "Hmm. We'll trade, but I'm watching you."
    - weight: 50
      frames:
        - "Только без фокусов, понял?"
      frames_en:
        - "No tricks, understood?"
    - weight: 50
      frames:
        - "Цены для тебя сегодня повыше. Сам знаешь почему."
      frames_en:
        - "Prices are higher for you today. You know why."
    - weight: 50
      frames:
        - "Руки держи на виду."
      frames_en:
        - "Keep your hands where I can see them."
    - weight: 50
      frames:
        - "Я тебя запомнила. Быстро выбирай и уходи."
      frames_en:
        - "I remember you. Pick quickly and go."
    - weight: 50
      frames:
        - "Если что-то пропадёт, я знаю, кого искать."
      frames_en:
        - "If anything goes missing, I know who to look for."

- key: I04
  id: w_trade_done
  title: "Woman Completes a Trade"
  category: woman
  status: active
  trigger: "a woman completes a trade"
  speaker: woman
  variants:
    - weight: 50
      frames:
        - "Отличная сделка! Приходи ещё."
      frames_en:
        - "A great deal! Come again."
    - weight: 50
      frames:
        - "Спасибо! Теперь куплю детям новые ботиночки."
      frames_en:
        - "Thank you! Now I can buy the kids new boots."
    - weight: 50
      frames:
        - "Расскажу соседкам, что ты платишь честно. У нас это многого стоит."
      frames_en:
        - "I'll tell the neighbours you pay fair. That counts for a lot here."
    - weight: 50
      frames:
        - "Вот, держи. И не потеряй по дороге."
      frames_en:
        - "Here you go. And don't lose it on the way."
    - weight: 50
      frames:
        - "Изумрудик к изумрудику, глядишь, и на новый дом хватит."
      frames_en:
        - "Emerald by emerald, maybe we'll save up for a new house."
    - weight: 50
      frames:
        - "Хорошо поторговали! Заходи на пирожки."
      frames_en:
        - "Good trading! Come by for pies sometime."
    - weight: 50
      frames:
        - "Ты честный покупатель. Таких мало."
      frames_en:
        - "You're an honest customer. There aren't many."

- key: I05

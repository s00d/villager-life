      frames:
        - "Ничего не взял? Ну и ладно."
      frames_en:
        - "Didn't take anything? Oh well."
    - weight: 50
      frames:
        - "Только посмотреть пришёл? Бывает."
      frames_en:
        - "Just came to look? It happens."
    - weight: 50
      frames:
        - "Опять только посмотреть? Ладно, отложу для тебя самое лучшее."
      frames_en:
        - "Just looking again? Fine, I'll put the best ones aside for you."
    - weight: 50
      frames:
        - "Хмм… Зря ты так. Товар отличный."
      frames_en:
        - "Hmm… your loss. The goods are great."
    - weight: 50
      frames:
        - "Ладно, в другой раз."
      frames_en:
        - "All right, another time."
    - weight: 50
      frames:
        - "Я тут не для красоты стою, между прочим."
      frames_en:
        - "I'm not just standing here to look pretty, you know."

- key: I06

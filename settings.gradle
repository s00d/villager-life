pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

rootProject.name = 'villager-life'

// Every supported Minecraft version is a Stonecutter node: neoforge/versions/<version>/gradle.properties for NeoForge,
// neoforge/versions/<version>-forge for Forge (build-forge.gradle; //? if forge in the sources). The sources stay as
// NeoForge 1.21.1 sees them (vcsVersion); the other nodes build from Stonecutter's processed copy.
stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'
    create('neoforge') {
        versions '1.21.1', '1.21.4', '1.21.8', '1.21.11', '26.1.2', '26.2', '26.3'
        versions(['1.21.1-forge': '1.21.1', '1.21.4-forge': '1.21.4', '1.21.8-forge': '1.21.8', '1.21.11-forge': '1.21.11',
                  '26.1.2-forge': '26.1.2', '26.2-forge': '26.2', '26.3-forge': '26.3']).buildscript 'build-forge.gradle'
        vcsVersion = '1.21.1'
    }
}


project(':neoforge').buildFileName = 'stonecutter.gradle'

// What every node builds the same whatever its loader: the renames between Minecraft versions, the data rewritten
// for them, the voice jars, the analyzers. The loader's own part: build.gradle (NeoForge), build-forge.gradle (Forge).

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

// neoforge/, not the Stonecutter node under versions/
ext.branchDir = project.parent.projectDir
def branchDir = ext.branchDir

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir("${branchDir}/src/generated/resources")

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude(".cache/**") // datagen cache files
    exclude("**/*.PENDING_TTS") // voice lines waiting for TTS
    exclude("**/*.wav") // dub.py writes a clip as wav before it becomes ogg; a build during a run must not trip on it
    exclude("**/*.partial.ogg") // the same for the ogg it is still writing
}

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.blamejared.com' } }
        filter { includeGroup 'mezz.jei' }
    }
}

base {
    archivesName = 'villager-life'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)

// Minecraft versions in the build script: mc('>=1.21.4')
def mc = { String predicate -> stonecutter.eval(stonecutter.current.version, predicate) }
ext.mc = mc
// The mod loader of this node: <version> is NeoForge, <version>-forge is Forge (build-forge.gradle); //? if forge
def forge = stonecutter.current.project.endsWith('-forge')
ext.forge = forge
stonecutter.constants.match(forge ? 'forge' : 'neoforge', 'neoforge', 'forge')

// Renames between versions, applied to the sources Stonecutter writes for each version. Anything with a different
// meaning goes through com.vnap.Mc or a //? comment instead. A replacement Stonecutter has with a false condition runs
// backwards, and the sources are the oldest version's (1.21.1), which never needs that: a replacement is given only to
// the versions it is for (a 1.21.1 node other than the sources' own, 1.21.1-forge, would have them all run backwards).
stonecutter {
    if (mc('>=1.21.2')) replacements.string(true) {
        replace 'MobSpawnType', 'EntitySpawnReason'
        replace 'getMinBuildHeight()', 'getMinY()'
        replace '.registryOrThrow(', '.lookupOrThrow('
        replace '.getHolderOrThrow(', '.getOrThrow('
        replace 'SoundEvents.GENERIC_EAT', 'SoundEvents.GENERIC_EAT.value()'
        replace 'Direction.getNearest(', 'Direction.getApproximateNearest('
        replace '.dropLeash(true, false)', '.removeLeash()'
        replace 'Minecraft.getInstance().getTimer()', 'Minecraft.getInstance().getDeltaTracker()'
        replace 'Minecraft.getInstance().tell(', 'Minecraft.getInstance().schedule('
        replace '.getTag(EnchantmentTags.', '.get(EnchantmentTags.'
        // a respawn and a portal move by a TeleportTransition; a chorus fruit is any item that teleports
        replace 'DimensionTransition', 'TeleportTransition'
    }
    if (mc('>=1.21.2')) replacements.regex(true) {
        // NeoForge's event, not Forge's of the same name (which the Forge shim names in full)
        replace '(?<!minecraftforge\\.event\\.entity\\.)\\bEntityTeleportEvent\\.ChorusFruit\\b', 'EntityTeleportEvent.ItemConsumption', '(?!x)x', ''
        // Registry.get(id) is an Optional<Holder> from 1.21.2; getValue(id) is the old get
        replace 'BuiltInRegistries\\.(\\w+)\\.get\\(', 'BuiltInRegistries.$1.getValue(', 'BuiltInRegistries\\.(\\w+)\\.getValue\\(', 'BuiltInRegistries.$1.get('
        replace '\\bUseAnim\\b', 'ItemUseAnimation', '\\bItemUseAnimation\\b', 'UseAnim'
    }
    // 26.3: a pose turns by rotate(); renamed blocks and push reactions; a few sounds are holders
    if (mc('>=26.3')) replacements.regex(true) {
        replace '\\.mulPose\\(((?:com\\.mojang\\.math\\.)?Axis\\.)', '.rotate($1', '\\.rotate\\(((?:com\\.mojang\\.math\\.)?Axis\\.)', '.mulPose($1'
    }
    if (mc('>=26.3')) replacements.string(true) {
        replace 'PushReaction.DESTROY', 'PushReaction.POPPED'
        replace 'PushReaction.BLOCK', 'PushReaction.IMMOVEABLE'
        replace 'Tags.Blocks.GLASS_BLOCKS)', 'Tags.BlockItems.GLASS_BLOCKS.block())'
        replace 'Tags.Blocks.GLASS_PANES)', 'Tags.BlockItems.GLASS_PANES.block())'
        replace 'Tags.Items.ORES)', 'Tags.BlockItems.ORES.item())'
        // a test names its dimension from 26.3 (TestRegistrar)
        replace 'new TestData<>(batch,', 'new TestData<>(batch, net.minecraft.world.level.Level.OVERWORLD,'
        replace 'net.minecraft.world.level.block.DirtPathBlock', 'net.minecraft.world.level.block.PathBlock'
        replace 'SoundEvents.AXE_STRIP,', 'SoundEvents.AXE_STRIP.value(),'
        replace 'submitModel(model, state, pose, type, light, overlay, color, null, 0, null)', 'submitModel(model, state, pose, type, light, overlay, color, null, 0)'
    }
    // 26.2: entity types in EntityTypes, the sixteen colours of a block in one ColorCollection, tags shared by blocks and items
    if (mc('>=26.2')) replacements.regex(true) {
        replace '(?:net\\.minecraft\\.world\\.entity\\.)?\\bEntityType\\.([A-Z][A-Z_0-9]+)\\b', 'net.minecraft.world.entity.EntityTypes.$1', '\\bnet\\.minecraft\\.world\\.entity\\.EntityTypes\\.([A-Z][A-Z_0-9]+)\\b', 'EntityType.$1'
        ['WHITE', 'ORANGE', 'MAGENTA', 'LIGHT_BLUE', 'YELLOW', 'LIME', 'PINK', 'GRAY', 'LIGHT_GRAY', 'CYAN', 'PURPLE', 'BLUE', 'BROWN', 'GREEN', 'RED', 'BLACK'].each { c ->
            var m = c.toLowerCase().replaceAll(/_([a-z])/) { all, l -> l.toUpperCase() }
            var kinds = '(BED|WOOL|BANNER|WALL_BANNER|DYE|STAINED_GLASS_PANE|STAINED_GLASS|CARPET|CONCRETE)'
            replace "\\b(Blocks|Items)\\.${c}_${kinds}\\b".toString(), "\$1.\$2.${m}()".toString(), "\\b(Blocks|Items)\\.${kinds}\\.${m}\\(\\)".toString(), "\$1.${c}_\$2".toString()
            replace "\\b(Blocks|Items)\\.${c}_(CANDLE|TERRACOTTA)\\b".toString(), "\$1.DYED_\$2.${m}()".toString(), "\\b(Blocks|Items)\\.DYED_(CANDLE|TERRACOTTA)\\.${m}\\(\\)".toString(), "\$1.${c}_\$2".toString()
        }
        // copper blocks by weathering, waxed apart
        replace '\\b(Blocks|Items)\\.WAXED_COPPER_BLOCK\\b', '$1.COPPER_BLOCK.waxed().unaffected()', '\\b(Blocks|Items)\\.COPPER_BLOCK\\.waxed\\(\\)\\.unaffected\\(\\)', '$1.WAXED_COPPER_BLOCK'
        replace '\\b(Blocks|Items)\\.(COPPER_BLOCK|CUT_COPPER|LIGHTNING_ROD)\\b(?!\\.(weathering|waxed)\\()', '$1.$2.weathering().unaffected()', '\\b(Blocks|Items)\\.(COPPER_BLOCK|CUT_COPPER|LIGHTNING_ROD)\\.weathering\\(\\)\\.unaffected\\(\\)', '$1.$2'
        ['EXPOSED', 'WEATHERED', 'OXIDIZED'].each { w ->
            var m = w.toLowerCase()
            replace "\\b(Blocks|Items)\\.${w}_COPPER\\b".toString(), "\$1.COPPER_BLOCK.weathering().${m}()".toString(), "\\b(Blocks|Items)\\.COPPER_BLOCK\\.weathering\\(\\)\\.${m}\\(\\)".toString(), "\$1.${w}_COPPER".toString()
            replace "\\b(Blocks|Items)\\.${w}_CUT_COPPER\\b".toString(), "\$1.CUT_COPPER.weathering().${m}()".toString(), "\\b(Blocks|Items)\\.CUT_COPPER\\.weathering\\(\\)\\.${m}\\(\\)".toString(), "\$1.${w}_CUT_COPPER".toString()
            replace "\\b(Blocks|Items)\\.WAXED_${w}_COPPER\\b".toString(), "\$1.COPPER_BLOCK.waxed().${m}()".toString(), "\\b(Blocks|Items)\\.COPPER_BLOCK\\.waxed\\(\\)\\.${m}\\(\\)".toString(), "\$1.WAXED_${w}_COPPER".toString()
        }
        replace 'loadEntityRecursive\\(([\\w.]+), level, net\\.minecraft\\.world\\.entity\\.EntitySpawnReason\\.LOAD,', 'loadEntityRecursive($1, level, new net.minecraft.world.entity.EntitySpawnRequest(net.minecraft.world.entity.EntitySpawnReason.LOAD, false),', 'loadEntityRecursive\\(([\\w.]+), level, new net\\.minecraft\\.world\\.entity\\.EntitySpawnRequest\\(net\\.minecraft\\.world\\.entity\\.EntitySpawnReason\\.LOAD, false\\),', 'loadEntityRecursive($1, level, net.minecraft.world.entity.EntitySpawnReason.LOAD,'
        replace '(?:net\\.minecraft\\.tags\\.)?\\bItemTags\\.SMALL_FLOWERS\\b', 'net.minecraft.tags.BlockItemTags.SMALL_FLOWERS.item()', 'net\\.minecraft\\.tags\\.BlockItemTags\\.SMALL_FLOWERS\\.item\\(\\)', 'ItemTags.SMALL_FLOWERS'
        replace '(?:net\\.minecraft\\.tags\\.)?\\bBlockTags\\.SAPLINGS\\b', 'net.minecraft.tags.BlockItemTags.SAPLINGS.block()', 'net\\.minecraft\\.tags\\.BlockItemTags\\.SAPLINGS\\.block\\(\\)', 'BlockTags.SAPLINGS'
    }
    // 26.1: a screen extracts what it draws into GuiGraphicsExtractor, whose drawing calls lost their verbs
    if (mc('>=26.1')) replacements.string(true) {
        replace 'net.minecraft.world.level.storage.DimensionDataStorage', 'net.minecraft.world.level.storage.SavedDataStorage'
        replace 'Holder<TestEnvironmentDefinition>', 'Holder<TestEnvironmentDefinition<?>>'
        // a test's padding around its structure, new in 26.1 (TestRegistrar)
        replace 'test.spec().skyAccess());', 'test.spec().skyAccess(), 0);'
        replace 'net.minecraft.world.level.block.FarmBlock', 'net.minecraft.world.level.block.FarmlandBlock'
        // the old #dirt (grass, moss, mud and dirt) is #substrate_overworld from 26.1; #dirt is dirt alone
        replace 'BlockTags.DIRT)', 'BlockTags.SUBSTRATE_OVERWORLD)'
        // render states sorted into packages of their own; light is "coords" from 26.1
        replace 'net.minecraft.client.renderer.state.CameraRenderState', 'net.minecraft.client.renderer.state.level.CameraRenderState'
        replace 'net.minecraft.client.renderer.state.QuadParticleRenderState', 'net.minecraft.client.renderer.state.level.QuadParticleRenderState'
        replace 'net.minecraft.client.gui.render.state.pip.', 'net.minecraft.client.renderer.state.gui.pip.'
        replace 'net.minecraft.client.renderer.block.model.BlockStateModel', 'net.minecraft.client.renderer.block.dispatch.BlockStateModel'
        replace 'protected int getLightColor(float partialTick)', 'protected int getLightCoords(float partialTick)'
        // a screen's drawing methods, extract* from 26.1 (the container background takes the mouse first)
        replace 'public void render(GuiGraphics graphics, int mouseX, int mouseY, float partialTick)', 'public void extractRenderState(GuiGraphicsExtractor graphics, int mouseX, int mouseY, float partialTick)'
        replace 'public void render(GuiGraphics g, int mouseX, int mouseY, float partialTick)', 'public void extractRenderState(GuiGraphicsExtractor g, int mouseX, int mouseY, float partialTick)'
        replace 'public void renderBackground(GuiGraphics', 'public void extractBackground(GuiGraphicsExtractor'
        replace 'protected void renderLabels(GuiGraphics', 'protected void extractLabels(GuiGraphicsExtractor'
        replace 'protected void renderBg(GuiGraphics graphics, float partialTick, int mouseX, int mouseY) {', 'public void extractBackground(GuiGraphicsExtractor graphics, int mouseX, int mouseY, float partialTick) { super.extractBackground(graphics, mouseX, mouseY, partialTick);'
        replace 'super.render(graphics, ', 'super.extractRenderState(graphics, '
        replace 'super.render(g, ', 'super.extractRenderState(g, '
        replace 'renderTransparentBackground(', 'extractTransparentBackground('
        replace 'renderTooltip(graphics, mouseX, mouseY)', 'extractTooltip(graphics, mouseX, mouseY)'
    }
    // NeoForge's renamed events from 26.1 (the Forge shim keeps the names of NeoForge 1.21.1)
    if (mc('>=26.1') && !forge) replacements.string(true) {
        replace 'event.getNewDamage()', 'event.getHealthDamage()'
    }
    if (mc('>=26.1') && !forge) replacements.regex(true) {
        replace '(?<!minecraftforge\\.event\\.level\\.)\\bBlockEvent\\.BreakEvent\\b', 'net.neoforged.neoforge.event.level.block.BreakBlockEvent', '(?!x)x', ''
    }
    if (mc('>=26.1')) replacements.regex(true) {
        replace '\\bGuiGraphics\\b', 'GuiGraphicsExtractor', '\\bGuiGraphicsExtractor\\b', 'GuiGraphics'
        replace '\\b(graphics|g|guiGraphics)\\.drawString\\(', '$1.text(', '\\b(graphics|g|guiGraphics)\\.text\\(', '$1.drawString('
        replace '\\b(graphics|g|guiGraphics)\\.drawCenteredString\\(', '$1.centeredText(', '\\b(graphics|g|guiGraphics)\\.centeredText\\(', '$1.drawCenteredString('
        replace '\\b(graphics|g|guiGraphics)\\.renderItem\\(', '$1.item(', '\\b(graphics|g|guiGraphics)\\.item\\(', '$1.renderItem('
        replace '\\b(graphics|g|guiGraphics)\\.renderFakeItem\\(', '$1.fakeItem(', '\\b(graphics|g|guiGraphics)\\.fakeItem\\(', '$1.renderFakeItem('
        replace '\\b(graphics|g|guiGraphics)\\.renderItemDecorations\\(', '$1.itemDecorations(', '\\b(graphics|g|guiGraphics)\\.itemDecorations\\(', '$1.renderItemDecorations('
        replace '\\b(graphics|g|guiGraphics)\\.renderOutline\\(', '$1.outline(', '\\b(graphics|g|guiGraphics)\\.outline\\(', '$1.renderOutline('
    }
    // 1.21.11: ResourceLocation is Identifier, and many classes moved to packages of their own
    if (mc('>=1.21.11')) replacements.string(true) {
        replace 'ResourceLocation', 'Identifier'
        replace 'net.minecraft.world.entity.npc.Villager', 'net.minecraft.world.entity.npc.villager.Villager'
        replace 'Lnet/minecraft/world/entity/npc/Villager;', 'Lnet/minecraft/world/entity/npc/villager/Villager;'
        replace 'net.minecraft.world.entity.npc.AbstractVillager', 'net.minecraft.world.entity.npc.villager.AbstractVillager'
        replace 'net.minecraft.world.entity.npc.WanderingTrader', 'net.minecraft.world.entity.npc.wanderingtrader.WanderingTrader'
        replace 'net.minecraft.world.entity.animal.Bee', 'net.minecraft.world.entity.animal.bee.Bee'
        replace 'net.minecraft.world.entity.animal.Cat', 'net.minecraft.world.entity.animal.feline.Cat'
        replace 'net.minecraft.world.entity.animal.Chicken', 'net.minecraft.world.entity.animal.chicken.Chicken'
        replace 'net.minecraft.world.entity.animal.Cow', 'net.minecraft.world.entity.animal.cow.Cow'
        replace 'net.minecraft.world.entity.animal.IronGolem', 'net.minecraft.world.entity.animal.golem.IronGolem'
        replace 'net.minecraft.world.entity.animal.Parrot', 'net.minecraft.world.entity.animal.parrot.Parrot'
        replace 'net.minecraft.world.entity.animal.Pig', 'net.minecraft.world.entity.animal.pig.Pig'
        replace 'net.minecraft.world.entity.animal.horse.TraderLlama', 'net.minecraft.world.entity.animal.equine.TraderLlama'
        replace 'net.minecraft.world.entity.decoration.Painting', 'net.minecraft.world.entity.decoration.painting.Painting'
        replace 'net.minecraft.world.entity.monster.Zombie', 'net.minecraft.world.entity.monster.zombie.Zombie'
        replace 'net.minecraft.world.entity.projectile.AbstractArrow', 'net.minecraft.world.entity.projectile.arrow.AbstractArrow'
        replace 'net.minecraft.world.entity.projectile.Arrow', 'net.minecraft.world.entity.projectile.arrow.Arrow'
        replace 'net.minecraft.world.entity.projectile.ThrowableItemProjectile', 'net.minecraft.world.entity.projectile.throwableitemprojectile.ThrowableItemProjectile'
        replace 'net.minecraft.client.model.VillagerModel', 'net.minecraft.client.model.npc.VillagerModel'
        replace 'net.minecraft.advancements.critereon.', 'net.minecraft.advancements.criterion.'
        replace 'net.minecraft.Util', 'net.minecraft.util.Util'
        replace 'net.minecraft.world.level.GameRules', 'net.minecraft.world.level.gamerules.GameRules'
        replace 'net.minecraft.client.renderer.RenderType', 'net.minecraft.client.renderer.rendertype.RenderType'
    }
    if (mc('>=1.21.11')) replacements.string(true) {
        replace '.noCollission()', '.noCollision()'
    }
    if (mc('>=1.21.11')) replacements.regex(true) {
        replace '\\b(Blocks|Items)\\.CHAIN\\b', '$1.IRON_CHAIN', '\\b(Blocks|Items)\\.IRON_CHAIN\\b', '$1.CHAIN'
    }
    if (mc('>=1.21.9')) replacements.string(true) {
        replace 'Screen.hasShiftDown()', 'net.minecraft.client.Minecraft.getInstance().hasShiftDown()'
        replace 'TextureSheetParticle', 'SingleQuadParticle'
    }
    if (mc('>=1.21.6')) replacements.string(true) {
        replace 'SoundEvents.LEASH_KNOT_PLACE', 'SoundEvents.LEAD_TIED'
        replace 'net.neoforged.neoforge.common.util.TriState', 'net.minecraft.util.TriState'
        replace 'SoundEvents.LEASH_KNOT_BREAK', 'SoundEvents.LEAD_UNTIED'
        // one pass, its output not read again: on Forge straight to the shim's name
        replace 'PacketDistributor.sendToServer(', (forge ? 'com.vnap.neo' : 'net.neoforged') + '.neoforge.client.network.ClientPacketDistributor.sendToServer('
    }
    if (mc('>=1.21.5')) replacements.string(true) {
        replace 'net.minecraft.world.entity.animal.Sheep', 'net.minecraft.world.entity.animal.sheep.Sheep'
        // flowers, grass and saplings: BushBlock is one plant of its own from 1.21.5
        replace 'net.minecraft.world.level.block.BushBlock', 'net.minecraft.world.level.block.VegetationBlock'
        replace 'net.minecraft.world.entity.animal.Wolf', 'net.minecraft.world.entity.animal.wolf.Wolf'
        replace 'MobEffects.MOVEMENT_SLOWDOWN', 'MobEffects.SLOWNESS'
        replace 'MobEffects.MOVEMENT_SPEED', 'MobEffects.SPEED'
        replace 'MobEffects.DIG_SLOWDOWN', 'MobEffects.MINING_FATIGUE'
        replace 'MobEffects.DAMAGE_RESISTANCE', 'MobEffects.RESISTANCE'
        replace 'MobEffects.DAMAGE_BOOST', 'MobEffects.STRENGTH'
        replace 'MobEffects.CONFUSION', 'MobEffects.NAUSEA'
        replace 'MobEffects.DIG_SPEED', 'MobEffects.HASTE'
        replace 'SoundEvents.SHIELD_BLOCK,', 'SoundEvents.SHIELD_BLOCK.value(),'
        // the game tests' annotations are the mod's own from 1.21.5 (com.vnap.gametest.TestRegistrar)
        replace 'import net.minecraft.gametest.framework.GameTest;', 'import com.vnap.gametest.GameTest;'
        replace 'import net.neoforged.neoforge.gametest.GameTestHolder;', 'import com.vnap.gametest.GameTestHolder;'
        replace 'import net.neoforged.neoforge.gametest.PrefixGameTestTemplate;', 'import com.vnap.gametest.PrefixGameTestTemplate;'
        // the villager's goal packages take its profession's holder (VillagerGoalPackagesMixin)
        replace 'VillagerProfession profession, float speedModifier', 'net.minecraft.core.Holder<VillagerProfession> profession, float speedModifier'
    }
}

sourceSets {
    // NeoForge's API as the mod uses it, built on Forge (build-forge.gradle renames net.neoforged to com.vnap.neo there)
    if (!forge) {
        main.java.exclude 'com/vnap/neo/**'
        main.resources.exclude 'villager_life.forge.mixins.json'
    }
    // villager trades are data from 26.1: no event, no listing to add
    if (forge && mc('>=26.1')) {
        main.java.exclude 'com/vnap/neo/neoforge/event/village/VillagerTradesEvent.java', 'com/vnap/neo/neoforge/common/BasicItemListing.java'
    }
    // and brewing is recipes from 26.3
    if (forge && mc('>=26.3')) {
        main.java.exclude 'com/vnap/neo/neoforge/event/brewing/RegisterBrewingRecipesEvent.java'
    }
    // EMI ships for NeoForge 1.21.1 only
    if (!project.hasProperty('emi_version')) {
        main.java.exclude 'com/vnap/compat/emi/**'
    }
    // Data generation runs on 1.21.1 (its output in src/generated is the same JSON for every version);
    // NeoForge 21.4 replaced the model and blockstate providers with vanilla's; it is NeoForge's (Forge nodes skip it)
    if (mc('>=1.21.4') || forge) {
        main.java.exclude 'com/vnap/datagen/**'
    }
    // the trailer recorder (dev builds only) reads the frame from the GL target of 1.21.1's renderer
    if (mc('>=1.21.2')) {
        main.java.exclude 'com/vnap/client/dev/Recorder.java'
    }
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
// From 1.21.4 every item needs a client item (assets/<ns>/items/<id>.json); an item whose model is all it has
// gets one that just shows that model. Hand-written ones in src/main/resources (selects, tints) win.
if (mc('>=1.21.4')) {
    var ns = 'villager_life'
    var itemModels = files("${branchDir}/src/main/resources/assets/${ns}/models/item",
            "${branchDir}/src/generated/resources/assets/${ns}/models/item")
    var written = file("${branchDir}/src/main/resources/assets/${ns}/items")
    var separateTransforms = ['villager_blessing_staff', 'villager_blessing_staff_charged']
    var generateClientItems = tasks.register("generateClientItems") {
        inputs.files(itemModels)
        var out = layout.buildDirectory.dir("generated/sources/clientItems")
        outputs.dir(out)
        doLast {
            var dir = out.get().dir("assets/${ns}/items").asFile
            project.delete(dir)
            dir.mkdirs()
            itemModels.each { folder ->
                if (!folder.isDirectory()) return
                folder.eachFileMatch(~/.*\.json/) { model ->
                    var name = model.name
                    var id = name.replace('.json', '')
                    if (new File(written, name).exists() || separateTransforms.contains(id)) return
                    // a honed look (<id>_s1..3) is no item of its own: its item picks it below
                    if (id ==~ /.*_s\d(_pulling_\d)?/) return
                    var plain = { String m -> '{"type":"minecraft:model","model":"' + ns + ':item/' + m + '"}' }
                    // a bow: its pulling models by how long it is drawn, as vanilla's bow
                    var drawn = { String m -> !new File(folder, m + '_pulling_0.json').exists() ? plain(m) :
                            '{"type":"minecraft:condition","property":"minecraft:using_item","on_false":' + plain(m) +
                                ',"on_true":{"type":"minecraft:range_dispatch","property":"minecraft:use_duration","scale":0.05,"fallback":' + plain(m + '_pulling_0') +
                                ',"entries":[{"threshold":0.65,"model":' + plain(m + '_pulling_1') + '},{"threshold":0.9,"model":' + plain(m + '_pulling_2') + '}]}}' }
                    // spire gear: its look by the custom_model_data its hone sets (SpireGear.look)
                    var stages = (1..3).findAll { new File(folder, id + '_s' + it + '.json').exists() }
                    var look = stages.isEmpty() ? drawn(id) : '{"type":"minecraft:range_dispatch","property":"minecraft:custom_model_data","index":0,"fallback":' + drawn(id) +
                            ',"entries":[' + stages.collect { '{"threshold":' + it + ',"model":' + drawn(id + '_s' + it) + '}' }.join(',') + ']}'
                    new File(dir, name).text = '{"model":' + look + '}\n'
                }
            }
        }
    }
    sourceSets.main.resources.srcDir generateClientItems
    // armour is drawn from an equipment asset from 1.21.4: one for each armour material's layer textures (models/armor/<name>_layer_1/2)
    var armour = file("${branchDir}/src/main/resources/assets/${ns}/textures/models/armor")
    var equipment = file("${branchDir}/src/main/resources/assets/${ns}/equipment")
    var generateEquipment = tasks.register("generateEquipment") {
        inputs.dir(armour)
        var out = layout.buildDirectory.dir("generated/sources/equipment")
        outputs.dir(out)
        doLast {
            var root = out.get().dir("assets/${ns}").asFile
            project.delete(root)
            armour.eachFileMatch(~/.*_layer_1\.png/) { layer ->
                var name = layer.name.replace('_layer_1.png', '')
                // the spire armour's 64x64 sheets are for its model in the round (client/spire/SpireArmorModel), not equipment assets
                if (name.endsWith('_3d') || new File(equipment, name + '.json').exists()) return
                project.copy { from layer; into new File(root, 'textures/entity/equipment/humanoid'); rename { name + '.png' } }
                project.copy { from new File(armour, name + '_layer_2.png'); into new File(root, 'textures/entity/equipment/humanoid_leggings'); rename { name + '.png' } }
                var json = new File(root, "equipment/${name}.json")
                json.parentFile.mkdirs()
                json.text = '{"layers":{"humanoid":[{"texture":"' + ns + ':' + name + '"}],"humanoid_leggings":[{"texture":"' + ns + ':' + name + '"}]}}\n'
            }
        }
    }
    sourceSets.main.resources.srcDir generateEquipment
    // their client items pick the model per display context, which the removed neoforge:separate_transforms did
    sourceSets.main.resources.exclude(separateTransforms.collect { "assets/${ns}/models/item/${it}.json" })
}

// From 1.21.2 a recipe ingredient is "id" or "#tag", not {"item": id} / {"tag": tag}: the recipes are written as
// 1.21.1 reads them and rewritten for the later versions.
if (mc('>=1.21.2')) {
    var recipes = file("${branchDir}/src/main/resources/data/villager_life/recipe")
    var rewriteRecipes = tasks.register("rewriteRecipes") {
        inputs.dir(recipes)
        var out = layout.buildDirectory.dir("generated/sources/recipes")
        outputs.dir(out)
        doLast {
            var dir = out.get().dir("data/villager_life/recipe").asFile
            project.delete(dir)
            dir.mkdirs()
            var ingredient = { value -> value instanceof Map ? (value.item ?: '#' + value.tag) : value }
            recipes.eachFileMatch(~/.*\.json/) { source ->
                var recipe = new groovy.json.JsonSlurper().parse(source)
                if (recipe.ingredients != null) recipe.ingredients = recipe.ingredients.collect(ingredient)
                if (recipe.key != null) recipe.key = recipe.key.collectEntries { k, v -> [k, ingredient(v)] }
                if (recipe.ingredient != null) recipe.ingredient = ingredient(recipe.ingredient)
                new File(dir, source.name).text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(recipe)) + '\n'
            }
        }
    }
    sourceSets.main.resources.exclude 'data/villager_life/recipe/**'
    processResources.from(rewriteRecipes)
}

// Villager trades are data from 26.1 (until then the mod adds them in VillagerTradesEvent, Workshops): a journeyman sells
// his profession's decor, an expert its machines, each trade in the vanilla level tag
if (mc('>=26.1')) {
    var lists = "${branchDir}/src/main/resources/data/villager_life"
    var generateTrades = tasks.register("generateTrades") {
        inputs.files("${lists}/decor.json", "${lists}/machines.json")
        var out = layout.buildDirectory.dir("generated/sources/trades")
        outputs.dir(out)
        doLast {
            var root = out.get().asFile
            project.delete(root)
            var tags = [:].withDefault { [] }
            [['decor.json', 3, 4, 6, 10], ['machines.json', 4, 12, 3, 15]].each { file, level, emeralds, uses, xp ->
                new groovy.json.JsonSlurper().parse(new File("${lists}/${file}")).each { entry ->
                    var trade = new File(root, "data/villager_life/villager_trade/${entry.id}.json")
                    trade.parentFile.mkdirs()
                    trade.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                            wants: [id: 'minecraft:emerald', count: emeralds], gives: [id: "villager_life:${entry.id}"],
                            max_uses: uses, xp: xp, reputation_discount: 1.0])) + '\n'
                    tags["${entry.profession}/level_${level}"] << "villager_life:${entry.id}"
                }
            }
            tags.each { path, values ->
                var tag = new File(root, "data/minecraft/tags/villager_trade/${path}.json")
                tag.parentFile.mkdirs()
                tag.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([replace: false, values: values])) + '\n'
            }
        }
    }
    processResources.from(generateTrades)
}

// Brewing is recipes from 26.3 (until then Draughts adds them in RegisterBrewingRecipesEvent): an awkward potion and a
// chapter's reagent make the next chapter's draught. The chapters are GearTier's, in order.
if (mc('>=26.3')) {
    var generateBrewing = tasks.register("generateBrewing") {
        var out = layout.buildDirectory.dir("generated/sources/brewing")
        outputs.dir(out)
        doLast {
            var dir = out.get().dir("data/villager_life/recipe/brewing").asFile
            project.delete(dir)
            dir.mkdirs()
            var tiers = ['root', 'archive', 'clockwork', 'garden', 'deep', 'ice', 'spore', 'hive', 'star', 'summit']
            tiers.eachWithIndex { tier, i ->
                new File(dir, "spire_draught_${tier}.json").text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                        type: 'minecraft:brewing',
                        input: [item: 'minecraft:potion', potion_contents: [potions: 'minecraft:awkward']],
                        reagent: [item: "villager_life:spire_reagent_${tiers[(i + tiers.size() - 1) % tiers.size()]}".toString()],
                        output: [id: "villager_life:spire_draught_${tier}".toString()]])) + '\n'
            }
        }
    }
    processResources.from(generateBrewing)
}

// Loot tables from 26.3: one "condition" (several are an all_of), "modifier" for the functions, "type" names both,
// block_state_property is match_block. The tables are written (and generated) as 1.21.1 reads them.
if (mc('>=26.3')) {
    var lootDirs = ["${branchDir}/src/main/resources", "${branchDir}/src/generated/resources"].collect { file(it) }
    var rewriteLoot = tasks.register("rewriteLoot") {
        lootDirs.each { inputs.dir(it) }
        var out = layout.buildDirectory.dir("generated/sources/loot")
        outputs.dir(out)
        doLast {
            var root = out.get().asFile
            project.delete(root)
            Closure fix
            var condition = { Map c ->
                var t = [type: c.condition] + c.findAll { k, v -> k != 'condition' }
                if (t.type == 'minecraft:block_state_property') {
                    t = [type: 'minecraft:match_block', blocks: t.block] + (t.properties != null ? [state: t.properties] : [:])
                }
                fix(t)
            }
            fix = { node ->
                if (node instanceof List) return node.collect { fix(it) }
                if (!(node instanceof Map)) return node
                var m = [:]
                node.each { k, v ->
                    if (k == 'conditions') {
                        var list = v.collect { condition(it) }
                        m.condition = list.size() == 1 ? list[0] : [type: 'minecraft:all_of', terms: list]
                    } else if (k == 'functions') {
                        m.modifier = v.collect { f -> fix([type: f.function] + f.findAll { kk, vv -> kk != 'function' }) }
                    } else {
                        m[k] = fix(v)
                    }
                }
                m
            }
            lootDirs.each { dir ->
                project.fileTree(dir) { include 'data/*/loot_table/**/*.json' }.visit { details ->
                    if (details.directory) return
                    var target = new File(root, details.relativePath.pathString)
                    target.parentFile.mkdirs()
                    target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(fix(new groovy.json.JsonSlurper().parse(details.file)))) + '\n'
                }
            }
        }
    }
    sourceSets.main.resources.exclude 'data/*/loot_table/**'
    processResources.from(rewriteLoot)
}

// A dimension type from 1.21.11: a fixed time is has_fixed_time, the sky of "effects" is "skybox"; whether a dragon
// fight is held there is said from 26.1. The types are written as 1.21.1 reads them.
if (mc('>=1.21.11')) {
    var types = file("${branchDir}/src/main/resources/data/villager_life/dimension_type")
    var dragon = mc('>=26.1')
    var rewriteDimensionTypes = tasks.register("rewriteDimensionTypes") {
        inputs.dir(types)
        inputs.property('dragon', dragon)
        var out = layout.buildDirectory.dir("generated/sources/dimensionTypes")
        outputs.dir(out)
        doLast {
            var dir = out.get().dir("data/villager_life/dimension_type").asFile
            project.delete(dir)
            dir.mkdirs()
            types.eachFileMatch(~/.*\.json/) { source ->
                var type = new groovy.json.JsonSlurper().parse(source)
                if (type.fixed_time != null) type.has_fixed_time = true
                if (type.effects == 'minecraft:the_end') type.skybox = 'end'
                if (type.effects == 'minecraft:the_nether') type.skybox = 'none'
                if (dragon && type.has_ender_dragon_fight == null) type.has_ender_dragon_fight = false
                new File(dir, source.name).text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(type)) + '\n'
            }
        }
    }
    sourceSets.main.resources.exclude 'data/villager_life/dimension_type/**'
    processResources.from(rewriteDimensionTypes)
}

// The block atlas holds no item textures from 1.21.11, and a model's sprite is looked up in the item atlas first
// (26.x): the mod's block models that show items (the goods on a rack) get those sprites under names of their own,
// villager_life:block/item/<name>, added to the block atlas.
if (mc('>=1.21.11')) {
    var modelDirs = ["${branchDir}/src/main/resources", "${branchDir}/src/generated/resources"].collect { file(it) }
    var itemSprite = ~/"minecraft:item\/([a-z0-9_\/]+)"/
    var blockAtlas = tasks.register("blockAtlas") {
        modelDirs.each { inputs.dir(it) }
        var out = layout.buildDirectory.dir("generated/sources/atlas")
        outputs.dir(out)
        doLast {
            var sprites = new TreeSet<String>()
            modelDirs.each { dir ->
                project.fileTree(dir) { include 'assets/*/models/block/**/*.json' }.each { model ->
                    (model.text =~ itemSprite).each { match -> sprites << match[1] }
                }
            }
            var atlas = new File(out.get().asFile, 'assets/minecraft/atlases/blocks.json')
            atlas.parentFile.mkdirs()
            atlas.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([sources: sprites.collect {
                [type: 'minecraft:single', resource: 'minecraft:item/' + it, sprite: 'villager_life:block/item/' + it] }])) + '\n'
        }
    }
    processResources {
        from(blockAtlas)
        filesMatching('assets/*/models/block/**/*.json') {
            // the chain's texture is iron_chain from 1.21.11, as the block
            filter { String line -> line.replaceAll(itemSprite, '"villager_life:block/item/$1"').replace('"minecraft:block/chain"', '"minecraft:block/iron_chain"') }
        }
    }
}

// Item ids renamed by the game, in the mod's data (recipes, prices); structures go through the game's data fixers
def renamedIds = mc('>=1.21.11') ? ['minecraft:chain': 'minecraft:iron_chain'] : [:]
// HumanoidModel.ArmPose takes whether the pose moves the off hand too from 1.21.11 (StaffClient.TOLL_POSE)
def armPose = mc('>=1.21.11') ? '(ZZLnet/neoforged/neoforge/client/IArmPoseTransformer;)V' : '(ZLnet/neoforged/neoforge/client/IArmPoseTransformer;)V'
processResources {
    inputs.property('renamedIds', renamedIds)
    inputs.property('armPose', armPose)
    filesMatching('META-INF/enumextensions.json') {
        filter { String line -> line.replace('(ZLnet/neoforged/neoforge/client/IArmPoseTransformer;)V', armPose) }
    }
    if (!renamedIds.isEmpty()) {
        filesMatching('data/**/*.json') {
            filter { String line -> renamedIds.inject(line) { text, from, to -> text.replace('"' + from + '"', '"' + to + '"') } }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// The voice: one jar per language of sounds/voice/<lang> (villager-life-<version>-<lang>.jar), with that language's
// clips only, played whatever language the game is in; a new folder there is one more jar. The plain jar task, the
// dev client and the GameTests take -Pvoice=<lang> (English by default). sounds.json (tools/expand) names every line
// twice, dialogue.* in voice/en and dialogue_ru.* in voice/ru: a jar keeps dialogue.* pointed at its own voice.
def voiceRoot = file("${branchDir}/src/main/resources/assets/villager_life/sounds/voice")
def voices = ((voiceRoot.listFiles() ?: []) as List<File>).findAll { it.directory }*.name.sort()
def voice = (project.findProperty('voice') ?: (voices.contains('en') || voices.isEmpty() ? 'en' : voices[0])) as String
def soundsSource = file("${branchDir}/src/main/resources/assets/villager_life/sounds.json")
// sounds.json for one voice: dialogue.* in voice/<lang>, dialogue_ru.* gone, and a line whose clip that language has
// not got yet (PENDING_TTS) with no sounds: it plays nothing (DialogueSoundState.exists), and the game warns neither
// about a missing file (were it listed) nor about an event without an entry (were it left out)
def voiceSounds = { File source, String lang ->
    def json = new groovy.json.JsonSlurper().parse(source)
    json.keySet().removeIf { it.startsWith('dialogue_ru.') }
    json.each { key, entry ->
        if (!key.startsWith('dialogue.')) return
        entry.sounds.each { it.name = it.name.replace(':voice/en/', ":voice/${lang}/") }
        entry.sounds.removeIf { !new File(voiceRoot, "${lang}/${it.name.split('/')[-1]}.ogg").exists() }
    }
    groovy.json.JsonOutput.toJson(json)
}
processResources {
    inputs.property('voice', voice)
    // a folder's path has no slash at its end
    exclude { (it.path + '/').startsWith('assets/villager_life/sounds/voice/') && it.path != 'assets/villager_life/sounds/voice'
            && !(it.path + '/').startsWith("assets/villager_life/sounds/voice/${voice}/") }
    doLast {
        def sounds = new File(destinationDir, 'assets/villager_life/sounds.json')
        if (sounds.exists()) sounds.text = voiceSounds(sounds, voice)
    }
}
tasks.named('jar', Jar).configure {
    archiveClassifier = voice
}
def voiceJars = voices.findAll { it != voice }.collect { lang ->
    def soundsFor = tasks.register("voiceSounds${lang.capitalize()}") {
        def out = layout.buildDirectory.dir("voice/${lang}")
        inputs.file(soundsSource)
        inputs.dir("${voiceRoot}/${lang}")
        outputs.dir(out)
        doLast {
            def file = out.get().file('assets/villager_life/sounds.json').asFile
            file.parentFile.mkdirs()
            file.text = voiceSounds(soundsSource, lang)
        }
    }
    tasks.register("voiceJar${lang.capitalize()}", Zip) {
        group = 'build'
        description = "The mod with the ${lang} voice"
        archiveBaseName = base.archivesName
        archiveVersion = project.version
        archiveClassifier = lang
        archiveExtension = 'jar'
        destinationDirectory = tasks.named('jar', Jar).flatMap { it.destinationDirectory }
        def built = tasks.named('jar', Jar).flatMap { it.archiveFile }
        dependsOn tasks.named("jar")
        inputs.dir("${voiceRoot}/${lang}")
        from(zipTree(built)) {
            exclude 'assets/villager_life/sounds/voice/**', 'assets/villager_life/sounds.json'
        }
        from(soundsFor)
        from("${voiceRoot}/${lang}") {
            into "assets/villager_life/sounds/voice/${lang}"
            exclude '**/*.PENDING_TTS', '**/*.wav', '**/*.partial.ogg'
        }
    }
}
tasks.named('assemble') { dependsOn voiceJars }

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Specification-Title': mod_name,
                'Specification-Vendor': 'Villager Life',
                'Specification-Version': '1',
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor': 'Villager Life'
        )
    }
}


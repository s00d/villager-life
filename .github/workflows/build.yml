name: Build

# Builds the mod for every Minecraft version, a job per version at the same time, every loader of it in that job
# (Stonecutter nodes in neoforge/versions: <mc> for NeoForge, <mc>-forge for Forge, <mc>-fabric for Fabric), and uploads
# a jar per loader and voice (villager-life[-forge|-fabric]-<version>+<mc>-<lang>.jar, one per folder of sounds/voice:
# see neoforge/build.gradle). A pushed version tag (1.0.0, matching mod_version) publishes the jars as a GitHub release
# of that name. Only the jars are built here: GameTests, ErrorProne, NullAway and SpotBugs run locally (tools/dev/gts.sh,
# gradle build), not here.
on:
  push:
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.1', '1.21.4', '1.21.8', '1.21.11', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4

      # Gradle (and Fabric's Loom) runs on 25; the nodes before 26.x compile with a Java 21 toolchain (the last version
      # listed is the default)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/')
        run: grep -qx "mod_version=${GITHUB_REF_NAME}" gradle.properties

      - name: Jars of ${{ matrix.mc }} for every loader
        run: >-
          ./gradlew --no-configuration-cache -PskipAnalyzers
          :neoforge:${{ matrix.mc }}:assemble :neoforge:${{ matrix.mc }}-forge:assemble :neoforge:${{ matrix.mc }}-fabric:assemble

      # every voice's jar of this version (a new language is one more jar, nothing to add here)
      - uses: actions/upload-artifact@v4
        with:
          name: villager-life-${{ matrix.mc }}
          path: |
            neoforge/versions/${{ matrix.mc }}/build/libs/villager-life-*.jar
            neoforge/versions/${{ matrix.mc }}-forge/build/libs/villager-life-*.jar
            neoforge/versions/${{ matrix.mc }}-fabric/build/libs/villager-life-*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The notes are the CHANGELOG section of this version
      - name: Release notes
        run: |
          rm -f dist/*-sources.jar
          awk -v v="$GITHUB_REF_NAME" '/^## \[/{on=index($0,"["v"]")>0;next} on' CHANGELOG.md > notes.md
          test -s notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          body_path: notes.md
          make_latest: true

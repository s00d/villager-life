name: Build

# One job builds the mod for every Minecraft version (Stonecutter nodes in neoforge/versions), a jar per version and
# voice (villager-life-<version>+<mc>-<lang>.jar, one per folder of sounds/voice: see neoforge/build.gradle), runs the
# GameTests of every version and, for a pushed version tag (1.0.0, matching mod_version), publishes the jars as a
# GitHub release of that name. A manual run builds, and runs the tests if asked.
on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      gametests:
        description: Run the GameTests of every version too
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle runs on 21; the 26.x nodes compile with a Java 25 toolchain (the last version listed is the default)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/')
        run: grep -qx "mod_version=${GITHUB_REF_NAME}" gradle.properties

      - name: Build every version (ErrorProne, NullAway, SpotBugs)
        run: ./gradlew --no-configuration-cache build

      - name: GameTests of every version
        if: ${{ inputs.gametests || startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew --no-configuration-cache --continue runGameTestServer

      - name: Jars
        run: |
          mkdir dist
          cp neoforge/versions/*/build/libs/villager-life-*.jar dist/
          rm -f dist/*-sources.jar
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: villager-life
          path: dist/*.jar
          if-no-files-found: error

      # The notes are the CHANGELOG section of this version
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          awk -v v="$GITHUB_REF_NAME" '/^## \[/{on=index($0,"["v"]")>0;next} on' CHANGELOG.md > notes.md
          test -s notes.md

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.jar
          body_path: notes.md
          make_latest: true
